<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Das Programm</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Das Programm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --fg:#0b1220; --mut:#667085; --line:#e4e8ef;
  --acc:#16a34a; --accd:#15803d; --bad:#dc2626; --warn:#d97706; --chip:#eef2f7;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1220; --card:#151d2e; --fg:#eef2f7; --mut:#95a1b6; --line:#263147; --chip:#1d2739; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--fg);
  padding:max(10px,env(safe-area-inset-top)) 0 calc(76px + env(safe-area-inset-bottom));
}
main{max-width:620px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:19px;margin:0;letter-spacing:-.01em}
header .dot{width:26px;height:26px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td,th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:left;font-weight:600}
.ok{color:var(--acc)} .bad{color:var(--bad)} .warn{color:var(--warn)}
input,select,textarea,button{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin:5px 0;appearance:none}
textarea{min-height:60px;resize:vertical}
button{background:var(--acc);color:#fff;border:0;font-weight:700;cursor:pointer}
button:active{background:var(--accd)}
button.ghost{background:var(--chip);color:var(--fg)}
button.s{width:auto;padding:8px 12px;font-size:14px;background:var(--chip);color:var(--fg);font-weight:600}
button.x{width:auto;padding:6px 10px;background:transparent;color:var(--mut);font-size:16px}
label{font-size:13px;color:var(--mut);display:block;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;margin:4px 0}
.row>.x,.row>.s{flex:0 0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav a b{display:block;font-size:19px;font-weight:400;line-height:1.3}
nav a.on{color:var(--acc)}
body.locked nav,body.locked #install,body.locked #backdrop{display:none}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.chip{display:inline-block;background:var(--chip);color:var(--mut);border-radius:999px;padding:2px 9px;font-size:12px;margin:3px 4px 0 0}
img.ph{width:100%;max-height:46vh;object-fit:cover;border-radius:12px;margin-top:8px;display:block;background:var(--chip)}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;background:var(--chip);color:var(--fg);font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.flex{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero{background:linear-gradient(140deg,#16a34a,#0d9488);color:#fff;border:0;text-align:center;padding:22px 16px}
.hero .flame{font-size:40px;line-height:1}
.hero .big{font-size:38px;margin-top:2px}
.hero .sub,.hero h2{color:rgba(255,255,255,.88)}
.hero .bar{background:rgba(255,255,255,.28);margin:14px 0 6px}
.hero .bar i{background:#fff}
.nudge{display:flex;gap:12px;align-items:center;background:var(--chip);border:1px solid var(--line)}
.nudge .ic{font-size:26px;flex:0 0 auto}
.nudge .tx{flex:1;min-width:0}
.nudge b{display:block;font-size:15px}
.day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 6px 2px}
.day:first-child{margin-top:0}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.post .who{display:flex;align-items:center;gap:9px}
.post .av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.post .act{font-size:16px;margin-top:9px}
nav a{flex:1;text-align:center;padding:11px 0 13px;color:var(--mut);text-decoration:none;font-size:10px;font-weight:600}
#backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:29}
#backdrop.on{opacity:1;pointer-events:auto}
#install{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(2,6,23,.25);transform:translateY(115%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#install.on{transform:none}
#install .head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#install img{width:52px;height:52px;border-radius:14px;flex:0 0 auto}
#install h3{margin:0;font-size:17px}
#install p{margin:2px 0 0;font-size:13px;color:var(--mut)}
#install ol{margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
#install .arrow{text-align:center;font-size:26px;color:var(--acc);margin-top:10px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#0b1220;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
</style>
</head>
<body>
<main id="app"><div class="card">Lade…</div></main>
<nav>
  <a href="#home"><b>🔥</b>Start</a>
  <a href="#feed"><b>📣</b>Feed</a>
  <a href="#add"><b>➕</b>Eintrag</a>
  <a href="#set"><b>⚙️</b>Einstellungen</a>
</nav>
<div class="toast" id="toast"></div>
<div id="backdrop" onclick="laterInstall(false)"></div>
<div id="install" role="dialog" aria-modal="true" aria-labelledby="installTitle"></div>
<script>
/* ---------- Basis ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const weekOf = s => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
const addW = (w, n) => { const d = new Date(w + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 7 * n); return d.toISOString().slice(0, 10); };
const dm = s => s.slice(8) + "." + s.slice(5, 7) + ".";
const daysLeft = () => 7 - ((new Date().getDay() + 6) % 7);
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const relDay = iso => {
  const d = new Date(iso + "T12:00:00"), t = new Date(todayISO() + "T12:00:00");
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return "Heute";
  if (diff === 1) return "Gestern";
  if (diff === 2) return "Vorgestern";
  if (diff > 0 && diff < 7) return WD[d.getDay()];
  return WD[d.getDay()].slice(0, 2) + ", " + dm(iso) + (d.getFullYear() !== t.getFullYear() ? d.getFullYear() : "");
};
const money = (n, c) => (Math.round(n * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + c;

/* ---------- Installation ---------- */
let installEvent = null;
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isSafari = () => /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|chrome/i.test(navigator.userAgent);

addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; if (load.offered) showInstall(); });
addEventListener("appinstalled", () => { hideInstall(); localStorage.installed = "1"; toast("Installiert. 🎉"); });

function showInstall(force) {
  if (installed() || localStorage.installed === "1" || pinResolve || !D) return;
  if (!force) {
    const later = +localStorage.installLater || 0;
    if (Date.now() - later < 7 * 864e5) return;      // nach „Später" eine Woche Ruhe
    if (!installEvent && !isIos()) return;            // Browser ohne Dialog nicht belästigen
  }
  const box = document.getElementById("install");
  const head = `<div class="head"><img src="/icon-192.png" alt="">
    <div><h3 id="installTitle">Das Programm installieren</h3>
    <p>Als App auf dem Home-Bildschirm – mit Benachrichtigungen.</p></div></div>`;

  if (installEvent) {
    box.innerHTML = head +
      `<button onclick="doInstall()">Jetzt installieren</button>
       <button class="ghost" onclick="laterInstall(true)">Später</button>`;
  } else if (isIos()) {
    box.innerHTML = head +
      (isSafari() ? "" : `<p style="color:var(--warn);margin-top:10px">Das geht nur in Safari. Öffne diese Seite dort.</p>`) +
      `<ol><li>Unten auf <b>Teilen</b> tippen <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></li>
        <li><b>Zum Home-Bildschirm</b> wählen</li>
        <li>Rechts oben auf <b>Hinzufügen</b></li></ol>
       <div class="arrow">⬇︎</div>
       <button class="ghost" onclick="laterInstall(true)">Verstanden</button>`;
  } else {
    box.innerHTML = head +
      `<p style="margin-top:10px">In deinem Browser geht das über das Menü: <b>Zum Startbildschirm hinzufügen</b> bzw. <b>App installieren</b>.</p>
       <button class="ghost" onclick="laterInstall(true)">Verstanden</button>`;
  }
  box.classList.add("on");
  document.getElementById("backdrop").classList.add("on");
}
function hideInstall() {
  document.getElementById("install").classList.remove("on");
  document.getElementById("backdrop").classList.remove("on");
}
function laterInstall(remember) { if (remember) localStorage.installLater = Date.now(); hideInstall(); }
async function doInstall() {
  if (!installEvent) return hideInstall();
  hideInstall();
  const e = installEvent; installEvent = null;
  e.prompt();
  const { outcome } = await e.userChoice;
  if (outcome !== "accepted") localStorage.installLater = Date.now();
}

let D = null, busy = false;
let pin = localStorage.pin || "";
let me = +localStorage.me || 0;
const device = localStorage.device || (localStorage.device = (crypto.randomUUID ? crypto.randomUUID() : "d" + Date.now() + Math.random().toString(36).slice(2)));

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }

let pinResolve = null;
function askPin(wrong) {
  return new Promise(res => {
    pinResolve = res;
    document.body.classList.add("locked");
    $("#app").innerHTML = `<div class="card" style="margin-top:18vh;text-align:center">
      <div style="font-size:42px;line-height:1">🔒</div>
      <h2 style="text-align:center;margin-top:8px">Gruppen-PIN</h2>
      <div class="sub">${wrong ? '<span class="bad">Die PIN stimmt nicht.</span>'
        : "Einmalig eingeben – dieses Gerät merkt sie sich."}</div>
      <input id="pinIn" type="text" autocapitalize="characters" autocorrect="off" autocomplete="off"
        placeholder="PIN" style="text-align:center;letter-spacing:.35em;font-size:20px;text-transform:uppercase"
        onkeydown="if(event.key==='Enter')submitPin()">
      <button onclick="submitPin()">Weiter</button></div>`;
    setTimeout(() => $("#pinIn")?.focus(), 60);
  });
}
function submitPin() {
  const v = $("#pinIn").value.trim();
  if (!v) return;
  pin = v; localStorage.pin = v;
  document.body.classList.remove("locked");
  const done = pinResolve; pinResolve = null; done();
}

async function api(p, method = "GET", body, _retry = 0) {
  const r = await fetch("/api/" + p, {
    method,
    headers: { "content-type": "application/json", "x-pin": pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    await askPin(_retry > 0);
    return api(p, method, body, _retry + 1);
  }
  if (!r.ok && r.headers.get("content-type")?.includes("json")) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || "Fehler " + r.status);
  }
  if (!r.ok) throw new Error("Fehler " + r.status);
  return r;
}
const get = p => api(p).then(r => r.json());

async function load() {
  try {
    D = await get("state");
    if (me && !D.members.some(m => m.id === me)) { me = 0; localStorage.removeItem("me"); }
    render();
    if (!load.offered) { load.offered = true; setTimeout(() => showInstall(), 1000); }
  } catch (e) { $("#app").innerHTML = '<div class="card"><h2>Fehler</h2>' + esc(e.message) + '</div>'; }
}

/* ---------- Auswertung ---------- */
const inWeek = (mid, w) => D.entries.filter(e => e.member_id === mid && weekOf(e.date) === w);
const done = (mid, w) => inWeek(mid, w).filter(e => e.kind !== "sick").length;
const sick = (mid, w) => inWeek(mid, w).filter(e => e.kind === "sick").reduce((a, e) => a + (e.units || 1), 0);
const credit = (mid, w) => done(mid, w) + Math.min(sick(mid, w), D.settings.sickMax ?? D.settings.required);

function weeksOf(member) {
  const s = D.settings;
  const from = weekOf((member.joined && member.joined > s.start) ? member.joined : s.start);
  const cur = weekOf(todayISO());
  const out = [];
  for (let w = from, i = 0; w < cur && i < 520; w = addW(w, 1), i++) out.push(w);
  return out;
}

function stats(member) {
  const s = D.settings, cur = weekOf(todayISO()), past = weeksOf(member);
  let missed = 0;
  for (const w of past) if (credit(member.id, w) < s.required) missed++;
  let streak = 0;
  if (credit(member.id, cur) >= s.required) streak++;
  for (let i = past.length - 1; i >= 0 && credit(member.id, past[i]) >= s.required; i--) streak++;
  return {
    missed, paid: missed * s.fine, streak,
    sessions: D.entries.filter(e => e.member_id === member.id && e.kind !== "sick").length,
    weeks: past.length,
  };
}

/* ---------- Start ---------- */
function viewHome() {
  const s = D.settings, c = s.currency, cur = weekOf(todayISO());
  if (!D.members.length) return onboarding();
  const st = {}; for (const m of D.members) st[m.id] = stats(m);
  const kasse = D.members.reduce((a, m) => a + st[m.id].paid, 0) - D.expenses.reduce((a, x) => a + x.amount, 0);
  const w4 = [3, 2, 1, 0].map(i => addW(cur, -i));
  const board = [...D.members].sort((a, b) => st[b.id].sessions - st[a.id].sessions || st[a.id].paid - st[b.id].paid);

  const whoCard = me ? "" : `<div class="card"><h2>Wer bist du?</h2><div class="sub">Einmal auswählen – dieses Gerät merkt sich das.</div>
    <div class="seg" style="flex-wrap:wrap">${D.members.map(m => `<button onclick="pickMe(${m.id})">${esc(m.name)}</button>`).join("")}</div></div>`;

  return whoCard + hero(st) + pushNudge() + `
  <div class="card"><h2>Diese Woche · ab ${dm(cur)} · Ziel ${s.required}</h2><table>
    ${D.members.map(m => {
      const d = done(m.id, cur), k = sick(m.id, cur), cr = credit(m.id, cur), ok = cr >= s.required;
      return `<tr><td>${esc(m.name)}${m.id === me ? ' <span class="chip">du</span>' : ""}
        <div class="bar"><i style="width:${Math.min(100, cr / s.required * 100)}%"></i></div></td>
        <td class="${ok ? "ok" : ""}">${d}${k ? " +" + k + "🤒" : ""} / ${s.required} ${ok ? "✓" : ""}</td>
        <td>${st[m.id].streak ? "🔥 " + st[m.id].streak : "–"}</td></tr>`;
    }).join("")}
  </table><div class="hint">Wer das Ziel verpasst, zahlt ${money(s.fine, c)} in die Kasse.</div></div>

  <div class="card"><h2>Letzte 4 Wochen</h2><table>
    <tr><th></th>${w4.map(w => `<th>${dm(w)}${w === cur ? "*" : ""}</th>`).join("")}</tr>
    ${D.members.map(m => `<tr><td>${esc(m.name)}</td>${w4.map(w => {
      const cr = credit(m.id, w), counts = weeksOf(m).includes(w) || w === cur;
      const cls = !counts ? "sub" : cr >= s.required ? "ok" : w === cur ? "warn" : "bad";
      return `<td class="${cls}">${counts ? done(m.id, w) + (sick(m.id, w) ? "🤒" : "") : "–"}</td>`;
    }).join("")}</tr>`).join("")}
  </table><div class="hint">* laufende Woche</div></div>

  <div class="card"><h2>Rangliste</h2><table>
    <tr><th></th><th>Einheiten</th><th>Verpasst</th><th>Eingezahlt</th></tr>
    ${board.map((m, i) => `<tr><td>${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(m.name)}</td>
      <td>${st[m.id].sessions}</td><td>${st[m.id].missed}/${st[m.id].weeks}</td><td>${money(st[m.id].paid, c)}</td></tr>`).join("")}
  </table></div>

  <div class="card">
    <div class="flex"><div><h2>Kassenstand</h2><div class="big ${kasse < 0 ? "bad" : ""}">${money(kasse, c)}</div></div></div>
    <div class="sub">${money(D.members.reduce((a, m) => a + st[m.id].paid, 0), c)} eingezahlt · ${money(D.expenses.reduce((a, x) => a + x.amount, 0), c)} ausgegeben</div>
  </div>`;
}

// Oben steht, was antreibt: die eigene Serie und was diese Woche noch fehlt.
function hero(st) {
  const s = D.settings, cur = weekOf(todayISO());
  if (!me) return "";
  const mine = st[me], cr = credit(me, cur), left = Math.max(0, s.required - cr), days = daysLeft();
  const pct = Math.min(100, s.required ? cr / s.required * 100 : 100);
  const headline = mine.streak
    ? `<div class="flame">🔥</div><div class="big">${mine.streak} ${mine.streak === 1 ? "Woche" : "Wochen"}</div><div class="sub">am Stück geschafft</div>`
    : `<div class="flame">💪</div><div class="big">Los geht's</div><div class="sub">Diese Woche startet deine Serie</div>`;
  const line = left === 0
    ? `Diese Woche erledigt · ${cr} ${cr === 1 ? "Einheit" : "Einheiten"}`
      + (mine.streak > 1 ? " · Serie hält" : "")
    : `Noch ${left} ${left === 1 ? "Einheit" : "Einheiten"} in ${days} ${days === 1 ? "Tag" : "Tagen"}`
      + ` · ${cr} von ${s.required}`;
  return `<div class="card hero">${headline}
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub">${line}</div></div>`;
}

// Bleibt stehen, bis Push auf diesem Gerät läuft.
function pushNudge() {
  if (localStorage.pushOn === "1") return "";
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "";
  if (!D.vapidPublicKey) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (Notification.permission === "denied")
    return `<div class="card nudge"><div class="ic">🔕</div><div class="tx"><b>Benachrichtigungen blockiert</b>
      <div class="sub">In den Einstellungen deines Browsers für diese Seite wieder erlauben.</div></div></div>`;
  if (ios && !standalone)
    return `<div class="card nudge"><div class="ic">🔔</div><div class="tx"><b>Benachrichtigungen</b>
      <div class="sub">Dafür die App erst zum Home-Bildschirm hinzufügen.</div></div>
      <button class="s" onclick="showInstall(true)">Wie?</button></div>`;
  return `<div class="card nudge"><div class="ic">🔔</div><div class="tx"><b>Benachrichtigungen einschalten</b>
    <div class="sub">Sonst verpasst du, wenn jemand eine Einheit einträgt.</div></div>

/* --- GPX / TCX --- */
const els = (root, name) => [...root.getElementsByTagNameNS("*", name)];
const txt = (root, name) => els(root, name)[0]?.textContent?.trim() || "";
const num = (root, name) => parseFloat(txt(root, name).replace(",", ".")) || 0;
const fmtDur = sec => sec >= 3600 ? Math.floor(sec / 3600) + ":" + pad(Math.round(sec % 3600 / 60)) + " h" : Math.round(sec / 60) + " min";
const fmtPace = (sec, km) => { const t = Math.round(sec / km); return Math.floor(t / 60) + ":" + pad(t % 60) + " /km"; };

function haversine(a1, o1, a2, o2) {
  const R = Math.PI / 180;
  const h = Math.sin((a2 - a1) * R / 2) ** 2 + Math.cos(a1 * R) * Math.cos(a2 * R) * Math.sin((o2 - o1) * R / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
}
function fromPoints(points, latAttr) {
  let km = 0;
  const co = points.map(latAttr);
  for (let i = 1; i < co.length; i++) if (co[i] && co[i - 1]) km += haversine(co[i - 1][0], co[i - 1][1], co[i][0], co[i][1]);
  return km;
}
function metaFrom(meta, km, sec, extra = {}) {
  const out = {};
  if (km > 0.05) out.Distanz = km.toFixed(2).replace(".", ",") + " km";
  if (sec > 30) out.Dauer = fmtDur(sec);
  if (km > 0.3 && sec > 60) out.Tempo = fmtPace(sec, km);
  for (const [k, v] of Object.entries(extra)) if (v) out[k] = v;
  return Object.keys(out).length ? out : null;
}
function parseGpx(xml) {
  const pts = els(xml, "trkpt").concat(els(xml, "rtept"));
  const km = fromPoints(pts, p => [+p.getAttribute("lat"), +p.getAttribute("lon")]);
  const times = pts.map(p => Date.parse(txt(p, "time"))).filter(t => !isNaN(t));
  const sec = times.length > 1 ? (Math.max(...times) - Math.min(...times)) / 1000 : 0;
  const type = txt(xml, "type") || els(xml, "trk")[0] && txt(els(xml, "trk")[0], "type");
  return metaFrom(null, km, sec, { Sport: type && type.length < 20 ? type : "" });
}
function parseTcx(xml) {
  const laps = els(xml, "Lap");
  let sec = 0, km = 0, kcal = 0, hr = [], dist = 0;
  for (const l of laps) {
    sec += num(l, "TotalTimeSeconds");
    dist += num(l, "DistanceMeters");
    kcal += num(l, "Calories");
    const h = els(l, "AverageHeartRateBpm")[0];
    if (h) { const v = num(h, "Value"); if (v) hr.push(v); }
  }
  km = dist / 1000;
  const pts = els(xml, "Trackpoint");
  if (km < 0.05) km = fromPoints(pts, p => { const pos = els(p, "Position")[0]; return pos ? [num(pos, "LatitudeDegrees"), num(pos, "LongitudeDegrees")] : null; });
  if (sec < 30) {
    const times = pts.map(p => Date.parse(txt(p, "Time"))).filter(t => !isNaN(t));
    if (times.length > 1) sec = (Math.max(...times) - Math.min(...times)) / 1000;
  }
  const sport = els(xml, "Activity")[0]?.getAttribute("Sport") || "";
  return metaFrom(null, km, sec, {
    Puls: hr.length ? Math.round(hr.reduce((a, b) => a + b, 0) / hr.length) + " bpm" : "",
    kcal: kcal ? String(Math.round(kcal)) : "",
    Sport: sport && sport !== "Other" ? sport : "",
  });
}

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Bild konnte nicht gelesen werden.")); i.src = url; });
    const k = Math.min(1, 1100 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    let q = 0.68, out = cv.toDataURL("image/jpeg", q);
    while (out.length > 650000 && q > 0.3) { q -= 0.12; out = cv.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

let pending = null;
async function preview() {
  pending = null;
  const f = $("#file").files[0];
  const box = $("#prev");
  if (!f) { box.textContent = ""; return; }
  box.textContent = "Lese Datei…";
  try {
    const low = f.name.toLowerCase();
    if (low.endsWith(".gpx") || low.endsWith(".tcx")) {
      const xml = new DOMParser().parseFromString(await f.text(), "application/xml");
      if (els(xml, "parsererror").length || xml.querySelector("parsererror")) throw new Error("Datei nicht lesbar.");
      const meta = low.endsWith(".gpx") ? parseGpx(xml) : parseTcx(xml);
      if (!meta) throw new Error("Keine Aktivitätsdaten gefunden.");
      pending = { meta };
      if (meta.Sport) {
        const field = $("#sport");
        if (field) field.value = normSport(meta.Sport);
        delete meta.Sport;
      }
      box.innerHTML = Object.entries(meta).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(v)}</span>`).join("");
    } else if (f.type.startsWith("image/")) {
      const photo = await shrink(f);
      pending = { photo };
      box.innerHTML = `<img class="ph" src="${photo}" alt="">`;
    } else throw new Error("Nur Bilder, GPX oder TCX.");
  } catch (e) { box.innerHTML = '<span class="bad">' + esc(e.message) + "</span>"; }
}

const keyToU8 = k => { const s = (k + "=".repeat((4 - k.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"); const r = atob(s); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };

const togglePush = run(async () => {
  const reg = await navigator.serviceWorker.ready;
  if (localStorage.pushOn === "1") {
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    await api("push/unsubscribe", "POST", { device });
    localStorage.pushOn = "0";
    toast("Push aus."); render(); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("Im Browser blockiert – bitte in den Website-Einstellungen erlauben.");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyToU8(D.vapidPublicKey) });
  await api("push/subscribe", "POST", { device, member_id: me || null, sub: sub.toJSON() });
  localStorage.pushOn = "1";
  toast("Push ist aktiv."); render();
});
const testPush = run(async () => { await api("push/test", "POST", { device }); toast("Gesendet – Benachrichtigung kommt gleich."); });
async function syncPushMember() {
  if (localStorage.pushOn !== "1" || !("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await api("push/subscribe", "POST", { device, member_id: me || null, sub: sub.toJSON() });
  } catch {}
}

/* ---------- Router ---------- */
const views = { home: viewHome, feed: viewFeed, add: viewAdd, set: viewSet };
function render() {
  if (!D) return;
  const h = location.hash.slice(1);
  const page = views[h] ? h : "home";
  $("#app").innerHTML = `<header><div class="dot">P</div><h1>Das Programm</h1></header>` + views[page]();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.hash === "#" + page));
  if (page === "add") setKind(kind);
  document.querySelectorAll("img[data-photo]").forEach(async img => {
    try { img.src = await (await api("photo/" + img.dataset.photo)).text(); } catch { img.remove(); }
  });
}
addEventListener("hashchange", render);
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
addEventListener("visibilitychange", () => { if (!document.hidden && D) load(); });
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => { if (e.data === "refresh") load(); });
load();
</script>
