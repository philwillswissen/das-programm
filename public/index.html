}
// Beim ersten Start steht nur die eine Frage da: keine Navigation, kein Installationsfenster.
const welcoming = () => !!(D && D.members.length && !me && !lookOnly());
function pickMe(id) { me = id; localStorage.me = id; syncPushMember(); render(); setTimeout(() => showInstall(), 800); }

/* ---------- Gemeinsame Einheit vorschlagen ---------- */
let planOpen = false;
function planCards() {
  const plans = (D.plans || []).filter(p => p.date >= todayISO());
  const nameOf = id => D.members.find(m => m.id === id)?.name || "?";
  const form = planOpen ? `<div class="card plan">
    <h2>Gemeinsame Einheit vorschlagen</h2>
    <label>Was?</label>
    <input id="pSport" list="sportList" autocomplete="off" placeholder="z. B. Bouldern" value="${esc(localStorage.lastSport || "")}">
    <datalist id="sportList">${SPORTS.map(x => `<option value="${esc(x[0])}">`).join("")}</datalist>
    <div class="row"><div><label>Wann?</label><input type="date" id="pDate" value="${todayISO()}" min="${todayISO()}"></div>
      <div><label>Uhrzeit</label><input type="time" id="pTime"></div></div>
    <label>Dazu</label><input id="pNote" placeholder="z. B. Treffpunkt Halle, 18 Uhr">
    <button onclick="savePlan()">Vorschlagen</button>
    <button class="ghost" onclick="planOpen=false;render()">Abbrechen</button></div>` : "";

  const list = plans.map(p => {
    const joined = p.joined || [];
    const inIt = joined.includes(me);
    const names = joined.map(nameOf);
    return `<div class="card plan">
      <div class="flex"><div><div class="when">${sportIcon(p.sport)} ${esc(p.sport || "Gemeinsame Einheit")}</div>
        <div class="sub">${relDay(p.date)}${p.time ? ", " + esc(p.time) + " Uhr" : ""} · von ${esc(nameOf(p.member_id))}</div></div>
        ${p.member_id === me ? `<button class="x" onclick="delPlan(${p.id})">✕</button>` : ""}</div>
      ${p.note ? `<div class="sub" style="margin-top:4px">${esc(p.note)}</div>` : ""}
      <div class="flex" style="margin-top:8px"><div class="sub">${names.length ? "Dabei: " + names.map(esc).join(", ") : "Noch niemand dabei."}</div>
      ${me ? `<button class="s${inIt ? "" : " go"}" onclick="joinPlan(${p.id}, ${inIt})">
        ${inIt ? "Doch nicht" : "Bin dabei"}</button>` : ""}</div></div>`;
  }).join("");

  // Der Knopf zum Vorschlagen steht in der Leiste darunter (filterBar).
  return form + list;
}

const savePlan = guard(async () => {
  if (!me) return toast("Erst auswählen, wer du bist (Mehr → Ich und dieses Gerät).");
  const date = $("#pDate").value || todayISO();
  await api("plan", "POST", {
    member_id: me, sport: normSport($("#pSport").value), date,
    time: $("#pTime").value, note: $("#pNote").value,
    dateText: relDay(date), device,
  });
  planOpen = false;
  toast("Vorgeschlagen.");
  await load();
});
const joinPlan = guard(async (id, leave) => {
  await api("plan/" + id + "/join", "POST", { member_id: me, leave });
  await load();
});
const delPlan = guard(async id => {
  if (!await ask("Vorschlag zurücknehmen?", "<p>Der Vorschlag verschwindet für alle aus dem Feed.</p>", "Zurücknehmen")) return;
  await api("plan/" + id, "DELETE");
  await load();

/* --- GPX / TCX --- */
const els = (root, name) => [...root.getElementsByTagNameNS("*", name)];
const txt = (root, name) => els(root, name)[0]?.textContent?.trim() || "";
const num = (root, name) => parseFloat(txt(root, name).replace(",", ".")) || 0;
const fmtDur = sec => sec >= 3600 ? Math.floor(sec / 3600) + ":" + pad(Math.round(sec % 3600 / 60)) + " h" : Math.round(sec / 60) + " min";
const fmtPace = (sec, km) => { const t = Math.round(sec / km); return Math.floor(t / 60) + ":" + pad(t % 60) + " /km"; };
const fmtPace100 = (sec, km) => { const t = Math.round(sec / (km * 10)); return Math.floor(t / 60) + ":" + pad(t % 60) + " /100 m"; };
const fmtKmh = (sec, km) => (km / (sec / 3600)).toFixed(1).replace(".", ",") + " km/h";

// Bei was man rollt oder gleitet, sagt km/h mehr als Minuten pro Kilometer.
const AS_KMH = new Set(["Radfahren", "Rennrad", "Mountainbike", "Gravelbike", "E-Bike",
  "Indoor-Cycling", "Spinning", "Skifahren", "Snowboard", "Langlauf", "Skitour", "Rodeln",
  "Inlineskaten", "Skateboard", "Eislaufen", "Reiten", "Segeln", "Kajak", "Kanu",
  "Stand-up-Paddling", "Surfen", "Kitesurfen", "Rudern", "Ruderergometer"]);
// Im Wasser rechnet man je 100 Meter.
const AS_100M = new Set(["Schwimmen", "Freiwasserschwimmen"]);

function speedOf(sec, km, sport) {
  if (!(km > 0.3 && sec > 60)) return null;
  if (AS_100M.has(sport)) return ["Tempo", fmtPace100(sec, km)];
  if (AS_KMH.has(sport)) return ["Schnitt", fmtKmh(sec, km)];
  if (!sport) return km / (sec / 3600) >= 12 ? ["Schnitt", fmtKmh(sec, km)] : ["Tempo", fmtPace(sec, km)];
  return ["Tempo", fmtPace(sec, km)];
}

// Anstieg mit Schwelle, damit GPS-Rauschen keine Berge erfindet.
function climbOf(elevations) {
  const e = elevations.filter(x => Number.isFinite(x));
  if (e.length < 3) return 0;
  let gain = 0, ref = e[0];
  for (const v of e) {
    if (v > ref + 3) { gain += v - ref; ref = v; }
    else if (v < ref) ref = v;
  }
  return Math.round(gain);
}

function haversine(a1, o1, a2, o2) {
  const R = Math.PI / 180;
  const h = Math.sin((a2 - a1) * R / 2) ** 2 + Math.cos(a1 * R) * Math.cos(a2 * R) * Math.sin((o2 - o1) * R / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
}
function fromPoints(points, latAttr) {
  let km = 0;
  const co = points.map(latAttr);
  for (let i = 1; i < co.length; i++) if (co[i] && co[i - 1]) km += haversine(co[i - 1][0], co[i - 1][1], co[i][0], co[i][1]);
  return km;
}
// Aus den rohen Werten wird die Anzeige - abhaengig davon, welche Sportart
// gerade im Feld steht. Wechselt sie, rechnet buildMeta neu.
function buildMeta(raw, sport) {
  if (!raw) return null;
  const { km = 0, sec = 0, climb = 0, hr = 0, kcal = 0 } = raw;
  const out = {};
  if (km > 0.05) out.Distanz = km.toFixed(2).replace(".", ",") + " km";
  if (sec > 30) out.Dauer = fmtDur(sec);
  const sp = speedOf(sec, km, sport);
  if (sp) out[sp[0]] = sp[1];
  if (climb >= 20) out["Anstieg"] = climb + " hm";
  if (hr) out.Puls = Math.round(hr) + " bpm";
  if (kcal) out.kcal = String(Math.round(kcal));
  return Object.keys(out).length ? out : null;
}
function parseGpx(xml) {
  const pts = els(xml, "trkpt").concat(els(xml, "rtept"));
  const km = fromPoints(pts, p => [+p.getAttribute("lat"), +p.getAttribute("lon")]);
  const times = pts.map(p => Date.parse(txt(p, "time"))).filter(t => !isNaN(t));
  const sec = times.length > 1 ? (Math.max(...times) - Math.min(...times)) / 1000 : 0;
  const climb = climbOf(pts.map(p => num(p, "ele")));
  const type = txt(xml, "type") || (els(xml, "trk")[0] && txt(els(xml, "trk")[0], "type"));
  return { km, sec, climb, sport: type && type.length < 20 ? type : "" };
}
function parseTcx(xml) {
  const laps = els(xml, "Lap");
  let sec = 0, km = 0, kcal = 0, hr = [], dist = 0;
  for (const l of laps) {
    sec += num(l, "TotalTimeSeconds");
    dist += num(l, "DistanceMeters");
    kcal += num(l, "Calories");
    const h = els(l, "AverageHeartRateBpm")[0];
    if (h) { const v = num(h, "Value"); if (v) hr.push(v); }
  }
  km = dist / 1000;
  const pts = els(xml, "Trackpoint");
  if (km < 0.05) km = fromPoints(pts, p => { const pos = els(p, "Position")[0]; return pos ? [num(pos, "LatitudeDegrees"), num(pos, "LongitudeDegrees")] : null; });
  if (sec < 30) {
    const times = pts.map(p => Date.parse(txt(p, "Time"))).filter(t => !isNaN(t));
    if (times.length > 1) sec = (Math.max(...times) - Math.min(...times)) / 1000;
  }
  const climb = climbOf(pts.map(p => num(p, "AltitudeMeters")));
  const sport = els(xml, "Activity")[0]?.getAttribute("Sport") || "";
  return {
    km, sec, climb, kcal,
    hr: hr.length ? hr.reduce((a, b) => a + b, 0) / hr.length : 0,
    sport: sport && sport !== "Other" ? sport : "",
  };
}

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Bild konnte nicht gelesen werden.")); i.src = url; });
    const k = Math.min(1, 1100 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    let q = 0.68, out = cv.toDataURL("image/jpeg", q);
    while (out.length > 650000 && q > 0.3) { q -= 0.12; out = cv.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

let pending = null;

  const box = $("#prev");
  if (box) box.innerHTML = Object.entries(meta).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(v)}</span>`).join("");

function resyncMeta() {
  if (!pending?.raw) return;
  const meta = buildMeta(pending.raw, normSport($("#sport")?.value));
  if (!meta) return;
  pending.meta = meta;
  showChips(meta);
}
async function preview() {
  pending = null;
  const f = $("#file").files[0];
  const box = $("#prev");
  if (!f) { box.textContent = ""; return; }
  box.textContent = "Lese Datei…";
  try {
    const low = f.name.toLowerCase();
    if (low.endsWith(".gpx") || low.endsWith(".tcx")) {
      const xml = new DOMParser().parseFromString(await f.text(), "application/xml");
      if (els(xml, "parsererror").length || xml.querySelector("parsererror")) throw new Error("Datei nicht lesbar.");
      const raw = low.endsWith(".gpx") ? parseGpx(xml) : parseTcx(xml);
      if (raw.sport) { const field = $("#sport"); if (field) field.value = normSport(raw.sport); }
      const meta = buildMeta(raw, normSport($("#sport")?.value));
      if (!meta) throw new Error("Keine Aktivitätsdaten gefunden.");
      pending = { meta, raw };
      showChips(meta);
    } else if (f.type.startsWith("image/")) {
      const photo = await shrink(f);
      pending = { photo };
      box.innerHTML = `<img class="ph" src="${photo}" alt="">`;
    } else throw new Error("Nur Bilder, GPX oder TCX.");
  } catch (e) { box.innerHTML = '<span class="bad">' + esc(e.message) + "</span>"; }
}

async function save() {
  if (busy) return; busy = true;
  const btn = $("#saveBtn"); if (btn) { btn.disabled = true; btn.textContent = "Speichere…"; }
  try {
    const body = {
      member_id: +$("#who").value, kind,
      units: kind === "sick" ? +$("#units").value : 1,
      date: $("#date").value || todayISO(),
      sport: kind === "sick" ? "" : normSport($("#sport").value),
      with: kind === "sick" ? [] : crew,
      note: $("#note").value, device,
      ...(pending || {}),
    };
    if (editId) {
      await api("entry/" + editId, "POST", body);
      editId = null;
      pending = null;
      toast("Geändert.");
      location.hash = "#feed";
      R = null;
      await load();
      return;
    }
    const leftBefore = me && D.stats?.[me]?.week?.left;
    await api("entry", "POST", body);
    if (body.sport) localStorage.lastSport = body.sport;
    R = null;                                   // Zahlen neu rechnen lassen
    crew = [];
    if (!me) { me = body.member_id; localStorage.me = me; }
    pending = null;
    if (location.hash === "#add" || location.hash === "") location.hash = "#home";
    await load();
    // Die Zahlen kommen weiter vom Server - hier wird nur verglichen, was er vorher und nachher sagt.
    const after = me && D.stats?.[me];
    const madeIt = leftBefore > 0 && after && after.week.left === 0;
    if (madeIt) { celebrate = true; render(); }
    toast(madeIt
      ? "Woche geschafft" + (after.streak > 1 ? " – Serie: " + after.streak + " Wochen" : "") + " 🔥"
      : kind === "sick" ? "Krankmeldung gespeichert." : "Einheit gespeichert. 💪");
  } catch (e) { toast(e.message); }
  finally {
    busy = false;
    const b = $("#saveBtn");
    if (b) { b.disabled = false; b.textContent = "Speichern"; }
  }
}

// Pushes zu Kudos und Kommentaren: gelten für die Person, also auf all ihren Geräten.
const PREF_TEXT = {
  kudos: [["all", "Alle in der Gruppe"], ["mine", "Nur für meine Einheiten"], ["off", "Keine"]],
  comments: [["all", "Alle in der Gruppe"], ["mine", "Nur meine und wo ich mitrede"], ["off", "Keine"]],
};
function pushPrefs() {
  const m = D.members.find(x => x.id === me) || {};
  const sel = (key, col, label) => `<label for="pref-${key}">${label}</label>
    <select id="pref-${key}" onchange="setPushPref('${key}', this.value)">
      ${PREF_TEXT[key].map(([v, t]) => `<option value="${v}"${(m[col] || "all") === v ? " selected" : ""}>${t}</option>`).join("")}</select>`;
  return sel("kudos", "push_kudos", "👏 Kudos") + sel("comments", "push_comments", "💬 Kommentare") +
    `<div class="hint">„Nur meine“ heißt: Kudos und Kommentare zu deinen eigenen Einträgen, bei Kommentaren auch dort,
      wo du selbst mitgeschrieben hast. Gilt auf allen deinen Geräten. Was du selbst gibst oder schreibst, meldet dir die App nie.</div>`;
}

const useLocation = guard(async () => {

  toast("Frage den Standort ab …");
  const pos = await new Promise((res, rej) =>
    navigator.geolocation.getCurrentPosition(res, rej, { timeout: 12000, maximumAge: 6 * 3600e3 }))
    .catch(() => { throw new Error("Standort nicht erlaubt oder nicht verfügbar."); });
  await api("member/" + me + "/geo", "POST", { lat: pos.coords.latitude, lon: pos.coords.longitude });
  localStorage.geoAsked = "1";
  toast("Standort gemerkt.");
  await load();
});

// Wenn die Freigabe schon erteilt ist, halten wir ihn still aktuell -
// damit der Hinweis auch stimmt, wenn jemand unterwegs ist.
async function refreshLocation() {
  if (!me || localStorage.geoAsked !== "1" || !navigator.geolocation) return;
  try {
    const st = await navigator.permissions?.query({ name: "geolocation" });
    if (st && st.state !== "granted") return;
    navigator.geolocation.getCurrentPosition(
      (pos) => api("member/" + me + "/geo", "POST", { lat: pos.coords.latitude, lon: pos.coords.longitude }).catch(() => {}),
      () => {}, { timeout: 8000, maximumAge: 12 * 3600e3 });
  } catch {}
}

/* ---------- Push ---------- */
const keyToU8 = k => { const s = (k + "=".repeat((4 - k.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"); const r = atob(s); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };

const togglePush = guard(async () => {
  const reg = await navigator.serviceWorker.ready;
  if (localStorage.pushOn === "1") {
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    await api("push/unsubscribe", "POST", { device });
    localStorage.pushOn = "0";
    toast("Push aus."); render(); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("Im Browser blockiert – bitte in den Website-Einstellungen erlauben.");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyToU8(D.vapidPublicKey) });
  await api("push/subscribe", "POST", { device, member_id: me || null, sub: sub.toJSON() });
  localStorage.pushOn = "1";
  toast("Push ist aktiv."); render();
});
const testPush = guard(async () => { await api("push/test", "POST", { device }); toast("Gesendet – Benachrichtigung kommt gleich."); });
async function syncPushMember() {
  if (localStorage.pushOn !== "1" || !("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await api("push/subscribe", "POST", { device, member_id: me || null, sub: sub.toJSON() });
  } catch {}
}

/* ---------- Router ---------- */
const views = { home: viewHome, feed: viewFeed, add: viewAdd, stats: viewStats, set: viewSet,
  "set/ich": viewSetMe, "set/kasse": viewSetKasse, "set/gruppe": viewSetGroup, "set/app": viewSetApp };
// Seitentitel: man sieht sofort, wo man ist. Unterseiten von "Mehr" bekommen einen Zurück-Pfeil.
const TITLES = { home: "Start", feed: "Feed", stats: "Zahlen", set: "Mehr",
  "set/ich": "Ich und dieses Gerät", "set/kasse": "Kasse", "set/gruppe": "Gruppe und Regeln", "set/app": "App" };
let lastPage = null;
function render() {
  if (!D) return;
  const h = location.hash.slice(1);
  const page = views[h] ? h : "home";
  const title = page === "add" ? (editId ? "Eintrag ändern" : "Neuer Eintrag") : TITLES[page];
  const back = page.startsWith("set/")
    ? `<a class="back" href="#set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Mehr</a>` : "";
  const app = $("#app");
  app.removeAttribute("aria-busy");
  app.innerHTML = back + `<header class="top"><h1>${title}</h1><img class="dot" src="/icon.svg?v=__V__" alt="Das Programm"></header>` + views[page]();
  // Kurzes Einblenden nur beim Seitenwechsel, nicht bei jedem Neuzeichnen.
  if (page !== lastPage) { app.classList.remove("in"); void app.offsetWidth; app.classList.add("in"); if (lastPage) scrollTo(0, 0); }
  lastPage = page;
  document.body.classList.toggle("welcoming", page === "home" && welcoming());
  const base = page.split("/")[0];
  document.querySelectorAll("nav a").forEach(a => { const on = a.hash === "#" + base; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  if (page === "add") {
    setKind(kind); paintCrew();
    const w = $("#who"); if (w) w.onchange = paintCrew;
    const sp = $("#sport"); if (sp) sp.oninput = () => { resyncMeta(); paintPicks(); };
    const dt = $("#date"); if (dt) dt.oninput = paintPicks;
    paintPicks();
  }
  document.querySelectorAll("img[data-photo]").forEach(showPhoto);
}
// Fotos: ein geladenes Bild bleibt im Speicher, neu geholt wird es nur, wenn es
// sich geändert hat. Und erst, wenn es gleich auf den Bildschirm kommt.
const photoCache = new Map();
const fetchPhoto = (id, img) => {
  if (!photoCache.has(id)) photoCache.set(id, api("photo/" + id).then(r => r.text()).catch(e => { photoCache.delete(id); throw e; }));
  photoCache.get(id).then(src => { img.src = src; }, () => img.remove());
};
const photoWatch = "IntersectionObserver" in window
  ? new IntersectionObserver(list => list.forEach(x => {
      if (!x.isIntersecting) return;
      photoWatch.unobserve(x.target);
      fetchPhoto(x.target.dataset.photo, x.target);
    }), { rootMargin: "800px 0px" })
  : null;
function showPhoto(img) {
  const id = img.dataset.photo;
  if (photoCache.has(id) || !photoWatch) return fetchPhoto(id, img);
  photoWatch.observe(img);
}

// Ein Hinweisfeld für alle Diagramme - antippen reicht, Zeigen auch.
(() => {
  const tip = () => document.getElementById("tip");
  let hideTimer = null;
  const show = (el, x, y) => {
    const t = tip();
    if (!t) return;
    t.textContent = el.dataset.tip;
    t.classList.add("on");
    const w = t.offsetWidth, h = t.offsetHeight;
    t.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + "px";
    t.style.top = Math.max(8, y - h - 12) + "px";
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => t.classList.remove("on"), 2600);
  };
  const at = (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) { tip()?.classList.remove("on"); return; }
    const r = el.getBoundingClientRect();
    show(el, r.left + r.width / 2, e.type === "pointerdown" ? r.top : r.top);
  };
  addEventListener("pointerdown", at, { passive: true });
  addEventListener("pointerover", (e) => { if (e.pointerType === "mouse") at(e); }, { passive: true });
})();

addEventListener("hashchange", () => { closeAllSheets(); if (location.hash !== "#add") editId = null; render(); });
addEventListener("keydown", e => { if (e.key === "Escape" && anySheetOpen()) { e.preventDefault(); closeAllSheets(); } });
// Den aktiven Tab noch einmal antippen: nach oben, wie in jeder App.
document.querySelector("nav").addEventListener("click", e => {
  const a = e.target.closest("a");
  if (a && a.hash === location.hash) { e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" }); }
});
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
// Beim Zurückkommen frisch laden - aber nicht, während jemand ein Formular
// ausfüllt. Sonst ist die halb getippte Eingabe weg, nur weil man kurz in
// einem anderen Tab den Schlüssel kopiert hat.
const currentPage = () => (views[location.hash.slice(1)] ? location.hash.slice(1) : "home");
addEventListener("visibilitychange", () => {
  if (document.hidden || !D) return;
  if (currentPage() === "add" || currentPage().startsWith("set")) return;
  load();
});
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => {
  if (e.data === "refresh") load();
  if (e.data === "show-feed") { location.hash = "#feed"; load(); }
});
load();
</script>
