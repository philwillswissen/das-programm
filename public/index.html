<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Das Programm</title>
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Das Programm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg?v=__V__" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png?v=__V__">
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --fg:#0b1220; --mut:#5d6779; --line:#e4e8ef;
  --acc:#15803d; --accd:#166534; --acct:#15803d; --accsoft:#16a34a1c; --bad:#dc2626; --warn:#b45309; --chip:#eef2f7;
  --field:#f7f9fc; --fieldline:#c3ccda; --focus:#16a34a33;
  --navh:64px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 1px rgba(16,24,40,.03);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1220; --card:#151d2e; --fg:#eef2f7; --mut:#9aa7bd; --line:#2b3850; --chip:#1f2b40;
         --field:#0d1526; --fieldline:#3b4a66; --focus:#22c55e40; --accsoft:#22c55e24; --acct:#4ade80; --warn:#f59e0b; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;
  padding:max(10px,env(safe-area-inset-top)) 0 calc(var(--navh) + 16px + env(safe-area-inset-bottom));
}
main{max-width:620px;margin:0 auto;padding:0 16px}
main.in{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Kopf: Seitentitel statt immer derselbe App-Name */
header.top{display:flex;align-items:center;gap:10px;margin:6px 2px 14px;min-height:40px}
header.top h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:800;flex:1}
header.top .dot{width:30px;height:30px;border-radius:9px;display:block;flex:0 0 auto}
a.back{display:inline-flex;align-items:center;gap:2px;color:var(--acct);text-decoration:none;font-weight:600;font-size:16px;
  min-height:44px;padding-right:12px;margin:0 0 -6px 2px}
a.back svg{width:20px;height:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-.005em;display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}
h2 small{font-size:13px;font-weight:500;color:var(--mut)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mut);font-weight:600}
td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
.nw{white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable.on{color:var(--acct)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:left;font-weight:600}
.ok{color:var(--acct)} .bad{color:var(--bad)} .warn{color:var(--warn)}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border-radius:12px;
  border:1.5px solid var(--fieldline);background:var(--field);color:var(--fg);margin:5px 0;appearance:none}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.75}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--focus)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=date],input[type=time]{min-height:46px}
textarea{min-height:64px;resize:vertical}
button{font:inherit;width:100%;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#fff;margin:5px 0;
  appearance:none;font-weight:700;cursor:pointer;min-height:44px}
button:active{background:var(--accd)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button.ghost{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
button.s{width:auto;padding:8px 14px;font-size:14px;background:var(--chip);color:var(--fg);font-weight:600;border:1px solid var(--line);min-height:36px}
button.x{width:auto;min-width:44px;min-height:44px;padding:6px 10px;background:transparent;color:var(--mut);font-size:16px;margin:-6px -8px -6px 0;border:0}
button.s.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button.link{width:auto;background:transparent;color:var(--acct);padding:6px 2px;font-weight:600;font-size:14px;min-height:36px;margin:0;border:0}
label{font-size:13px;color:var(--mut);display:block;margin-top:14px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;margin:4px 0}
.row>.x,.row>.s{flex:0 0 auto}
body.locked nav,body.locked #install,body.locked #backdrop{display:none}
body.welcoming nav{display:none}
#ask .btns{display:flex;gap:10px;margin-top:16px}
#ask .btns button{flex:1;margin:0}
#ask .warn{background:var(--bad);color:#fff}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.chip{display:inline-block;background:var(--chip);color:var(--mut);border-radius:999px;padding:2px 9px;font-size:12px;margin:3px 4px 0 0}
img.ph{width:100%;max-height:46vh;object-fit:cover;border-radius:12px;margin-top:10px;display:block;background:var(--chip)}
.seg{display:flex;gap:4px;margin:6px 0;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;background:transparent;color:var(--fg);font-weight:600;margin:0;min-height:40px;padding:9px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(2,6,23,.15)}
.seg.who{background:transparent;padding:0;gap:6px;flex-wrap:wrap}
.seg.who button{flex:1 1 auto;background:var(--chip)}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Reihenfarben: geprüfte Standardpalette, feste Reihenfolge, nie durchgewechselt.
   Dunkle Stufen sind dieselben Farbtöne, für die dunkle Fläche neu abgestuft. */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
      --s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
      --bar:#16a34a;--barq:#cbd5e1}
@media(prefers-color-scheme:dark){:root{
      --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
      --s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
      --bar:#22c55e;--barq:#334155}}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--chip);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile b small{font-size:13px;font-weight:600;color:var(--mut);margin-left:3px;letter-spacing:0}
.tile span{font-size:12px;color:var(--mut)}

.vbars{display:flex;gap:4px;height:136px;position:relative;margin:14px 0 2px}
.vbar{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:default}
/* Zeichenfläche: Säulen, Zahl und Ziel rechnen alle gegen dieselbe Höhe */
.vbar .plot{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;margin-top:14px}
.vbar i{display:block;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.vbar i.q{background:var(--barq)}
.vbar i.now{background:var(--accsoft);border:1.5px dashed var(--acc);border-bottom:0}
.vbar u{display:block;font-size:10px;color:var(--mut);text-align:center;text-decoration:none;line-height:1}
.vbar em{position:absolute;left:50%;transform:translateX(-50%);z-index:2;font-size:10px;font-style:normal;color:var(--fg);
  text-align:center;line-height:1;padding:1px 2px;background:var(--card);border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vbar .goal{position:absolute;left:-2px;right:-2px;z-index:1;border-top:1px dashed var(--mut);opacity:.8;pointer-events:none}
.vbar .goal b{position:absolute;left:calc(100% + 6px);top:-7px;font-size:10px;font-weight:600;color:var(--mut);white-space:nowrap;line-height:1.2}
.vstack{display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.vstack i{border-radius:0}
.vstack i:last-child{border-radius:4px 4px 0 0}

.hbar{display:grid;grid-template-columns:minmax(0,7.4em) 1fr 6.6em;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{background:var(--chip);border-radius:5px;height:10px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--bar);min-width:3px}
.hbar .vl{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:40;background:#0b1220;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;
     pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 4px 16px rgba(2,6,23,.3)}
#tip.on{opacity:.96}

.hero{background:linear-gradient(140deg,#15803d,#0f766e);color:#fff;border:0;text-align:center;padding:22px 18px 18px;box-shadow:0 8px 24px -12px rgba(13,148,136,.55)}
.hero .flame{font-size:40px;line-height:1}
.hero .big{font-size:40px;margin-top:2px}
.hero .sub,.hero h2{color:rgba(255,255,255,.92)}
.hero .bar{background:rgba(255,255,255,.28);margin:14px 0 6px;height:8px}
.hero .bar i{background:#fff}

/* Hinweise: eine schmale Zeile statt einer halben Seite */
.nudge{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 8px 12px;margin-bottom:12px}
.nudge .ic{font-size:20px;flex:0 0 auto;line-height:1}
.nudge .tx{flex:1;min-width:0;font-size:14px;line-height:1.3}
.nudge b{display:block;font-size:14px}
.nudge .sub{font-size:12px}
.nudge button.s{margin:0}
.nudge button.x{margin:0;min-width:36px}

/* Diese Woche + die drei davor in einer Karte */
.wk td{padding:9px 3px}
.wk td.nm{width:38%}
.wk th{white-space:nowrap}
/* Rangliste: Medaille und Name bleiben zusammen, Köpfe brechen nicht um */
.board th{white-space:nowrap}
.board td.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9.5em}
.board th.sortable{padding-top:12px;padding-bottom:12px}
@media (max-width:360px){.board td,.board th{padding-left:2px;padding-right:2px;font-size:14px}.board th{font-size:11px}}
.cell{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:12px;font-weight:700;
  border:1.5px dashed var(--fieldline);color:var(--mut)}
.cell.ok{background:var(--acc);border:1.5px solid var(--acc);color:#fff}
.cell.miss{border:1.5px dashed var(--bad);color:var(--bad)}
.cell.na{border-color:transparent;opacity:.5}
.wk .now{font-weight:700;white-space:nowrap}
.legend-cells{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.legend-cells .cell{width:16px;height:16px;border-radius:5px;font-size:9px;margin-right:5px;vertical-align:-4px}

details.more{margin-top:10px;border-top:1px solid var(--line)}
details.more summary{list-style:none;cursor:pointer;color:var(--acct);font-weight:600;font-size:14px;padding:12px 0 2px;min-height:40px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" \25BE"}
details.more[open] summary::after{content:" \25B4"}
.mine{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:14px}
.mine b{font-variant-numeric:tabular-nums}

.day{font-size:13px;font-weight:700;color:var(--mut);margin:18px 0 8px 4px}
.day:first-child{margin-top:0}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.post .who{display:flex;align-items:center;gap:10px}
.post .av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.post .act{font-size:16px;margin-top:9px}
.post button.more-btn{font-size:20px;letter-spacing:1px;line-height:1;color:var(--mut)}
/* Kudos und Kommentare unter einem Beitrag */
.social{display:flex;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.social button{width:auto;flex:0 0 auto;margin:0;padding:6px 12px;min-height:38px;font-size:14px;font-weight:600;
  background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.social button.on{background:var(--accsoft);border-color:var(--acc)}
.social button.on .kn{color:var(--acct)}
.social button:active{background:var(--line)}
.social .pop{animation:pop .3s ease-out}
@keyframes pop{40%{transform:scale(1.12)}}
.kfrom{font-size:13px;color:var(--mut);margin-top:7px}
.cmts{margin-top:8px;display:grid;gap:6px}
.cmt{background:var(--chip);border-radius:12px;padding:7px 11px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.cmt .tx{white-space:pre-line}
.cmt b{font-weight:700;margin-right:5px}
.cmt .when{font-size:12px;color:var(--mut);margin-left:6px;white-space:nowrap}
.cmts button.link{justify-self:start;padding:2px 2px;min-height:32px}
.cmtlist{display:grid;gap:8px;margin:10px 0 6px}
.cmtlist .cmt{display:flex;gap:8px;align-items:flex-start}
.cmtlist .cmt>div{flex:1;min-width:0}
.cmtlist .cmt button.x{margin:-8px -10px -8px 0;font-size:14px}
.cmtlist .sure{display:flex;gap:8px;margin-top:6px}
.cmtlist .sure button{width:auto;margin:0;padding:6px 12px;min-height:36px;font-size:14px}
.cmtlist .sure .warn{background:var(--bad);color:#fff}
.plan{border:1.5px dashed var(--acc);background:var(--card)}
.plan .when{font-weight:700}
.feedbar{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 10px;gap:8px}
.feedbar button{width:auto;background:transparent;color:var(--mut);border:0;font-weight:600;font-size:14px;padding:4px 2px;margin:0;min-height:36px}
.feedbar button.pl{color:var(--acct)}
.who-pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.who-pick button{flex:0 0 auto;width:auto;padding:7px 12px;font-size:14px;background:var(--chip);color:var(--fg);font-weight:600;margin:0;min-height:38px}
.who-pick button.on{background:var(--acc);color:#fff}

/* Eintrag */
.for{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.for label{margin:0;flex:0 0 auto;font-size:14px}
.for select{width:auto;flex:1;margin:0;padding:9px 34px 9px 12px;font-weight:600;border-radius:999px}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.picks button{width:auto;flex:0 0 auto;margin:0;padding:7px 12px;min-height:38px;font-size:14px;font-weight:600;
  background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:999px}
.picks button.on{background:var(--accsoft);border-color:var(--acc);color:var(--fg)}
.drop{position:relative;display:flex;gap:12px;align-items:center;border:1.5px dashed var(--fieldline);border-radius:14px;
  padding:14px;margin:6px 0;background:var(--field);color:var(--fg);font-size:15px;font-weight:600}
.drop .ic{font-size:24px;line-height:1}
.drop small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.savebar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 8px);z-index:5;margin-top:14px}
.savebar button{margin:0;box-shadow:0 8px 20px -8px rgba(22,163,74,.6)}

/* Mehr: Übersicht und Unterseiten */
.menu{padding:4px 0}
.menu a{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--fg);text-decoration:none;min-height:60px;border-top:1px solid var(--line)}
.menu a:first-child{border-top:0}
.menu .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:var(--chip)}
.menu .mt{flex:1;min-width:0}
.menu .mt b{display:block;font-size:16px}
.menu .mt span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .chev{color:var(--mut);font-size:22px;line-height:1}

/* Schalter statt "aktiv" + Knopf "Ausschalten" */
button.sw{width:52px;height:32px;min-height:32px;padding:0;border-radius:999px;background:var(--fieldline);position:relative;flex:0 0 auto;margin:0;transition:background .2s}
button.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(2,6,23,.3);transition:transform .2s}
button.sw.on{background:var(--acc)}
button.sw.on::after{transform:translateX(20px)}
button.sw:active{background:var(--fieldline)}
button.sw.on:active{background:var(--accd)}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;min-height:var(--navh);
  color:var(--mut);text-decoration:none;font-size:11px;font-weight:600}
nav a .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--acct)}
nav a.on .ico{background:var(--accsoft)}
nav a.plus .ico{width:46px;height:46px;margin-top:-16px;border-radius:50%;background:var(--acc);color:#fff;
  box-shadow:0 6px 16px -4px rgba(22,163,74,.6);border:3px solid var(--bg)}
nav a.plus.on .ico{background:var(--accd)}
nav a.plus svg{width:24px;height:24px}

#backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:29}
#backdrop.on{opacity:1;pointer-events:auto}
#install,.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:22px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(2,6,23,.25);transform:translateY(115%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;visibility:hidden;max-width:620px;margin:0 auto;max-height:88vh;overflow:auto}
#install::before,.sheet::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
#install.on,.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet p,.sheet li{font-size:14px;line-height:1.55;color:var(--mut);margin:7px 0}
.sheet b{color:var(--t)}
.sheet ul{margin:8px 0;padding-left:18px}
.actions button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--chip);color:var(--fg);font-weight:600;border:0}
.actions button.del{color:var(--bad)}
.actions .sub{margin:-2px 0 10px}
button.i{position:relative;width:22px;height:22px;min-height:22px;padding:0;border-radius:50%;background:var(--chip);color:var(--mut);font-size:12px;font-weight:700;line-height:22px;flex:0 0 auto;margin:0 0 0 2px;vertical-align:-4px}
button.i::after{content:"";position:absolute;inset:-11px}
.hero button.i{background:rgba(255,255,255,.25);color:#fff}
#install .head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#install img{width:52px;height:52px;border-radius:14px;flex:0 0 auto}
#install h3{margin:0;font-size:17px}
#install p{margin:2px 0 0;font-size:13px;color:var(--mut)}
#install ol{margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
#install .arrow{text-align:center;font-size:26px;color:var(--acct);margin-top:10px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom));background:#0b1220;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:35;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.96;transform:translate(-50%,0)}
.empty{text-align:center;padding:26px 18px}
.empty .ic{font-size:38px;line-height:1;margin-bottom:6px}
.empty b{display:block;font-size:17px;margin-bottom:4px}

/* Platzhalter beim Laden, in der Form der echten Karten */
.skel{background:var(--chip);border-radius:10px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--card) 55%,transparent),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-hero{height:178px;border-radius:18px;margin-bottom:12px}
.skel-line{height:14px;margin:12px 0}

/* Erster Start: eine Frage, ganze Seite */
.welcome{text-align:center;padding:28px 18px 22px}
.welcome img{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 12px}
.welcome h2{display:block;font-size:22px;margin:0 0 6px}
.welcome .sub{font-size:15px;max-width:30ch;margin:0 auto 16px}
.welcome .seg.who button{min-height:52px;font-size:16px}

/* Messwerte: Zahl groß, Bezeichnung klein darunter */
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.mrow div{min-width:0}
.mrow b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow span{display:block;font-size:12px;color:var(--mut)}
.mmore{font-size:13px;color:var(--mut);margin-top:6px;font-variant-numeric:tabular-nums}

/* Teilnehmer als lesbare Zeilen */
.plist button.prow{display:flex;align-items:center;gap:12px;background:transparent;color:var(--fg);font-weight:400;text-align:left;
  border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:10px 2px;min-height:56px}
.plist button.prow:first-child{border-top:0}
.plist button.prow:active{background:var(--chip)}
.plist .av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.plist .pt{flex:1;min-width:0}
.plist .pt b{display:block;font-weight:600}
.plist .pt span{font-size:13px;color:var(--mut)}
.plist .chev{color:var(--mut);font-size:22px;line-height:1}
.sheet button.danger{background:transparent;color:var(--bad);border:0;font-weight:600}

/* Diagramme: Monat unter der Achse, Platz rechts für die Zielmarke */
.vbars.has-goal{padding-right:44px}
.vbar u.mo{font-weight:600;min-height:10px;margin-top:1px}
.tbl-wrap{overflow-x:auto}

/* Ein Moment, wenn die Woche voll ist */
.hero.win .flame{animation:pop .7s cubic-bezier(.2,.8,.2,1.4)}
.hero.win .bar i{animation:fill 1s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fill{from{width:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="app" aria-busy="true"><div class="skel skel-hero"></div><div class="card"><div class="skel skel-line" style="width:40%"></div><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line" style="width:70%"></div></div><span class="sub" style="position:absolute;left:-9999px">Lade …</span></main>
<nav>
  <a href="#home"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></span>Start</a>
  <a href="#feed"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M7.5 9h9M7.5 13h9M7.5 17h5"/></svg></span>Feed</a>
  <a href="#add" class="plus"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Eintrag</a>
  <a href="#stats"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20v-8M12 20V5M18 20v-5M3 20h18"/></svg></span>Zahlen</a>
  <a href="#set"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>Mehr</a>
</nav>
<div class="toast" id="toast"></div>
<div id="tip"></div>
<div id="backdrop" onclick="laterInstall(false);hideInfo();askClose(false);closeSheet()"></div>
<div id="install" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="installTitle"></div>
<div id="info" class="sheet" role="dialog" tabindex="-1" aria-modal="true"></div>
<div id="ask" class="sheet" role="alertdialog" tabindex="-1" aria-modal="true"></div>
<div id="form" class="sheet" role="dialog" tabindex="-1" aria-modal="true"></div>
<script>
/* ---------- Basis ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const weekOf = s => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
const addW = (w, n) => { const d = new Date(w + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 7 * n); return d.toISOString().slice(0, 10); };
const dm = s => s.slice(8) + "." + s.slice(5, 7) + ".";
const daysLeft = () => 7 - ((new Date().getDay() + 6) % 7);
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const relDay = iso => {
  const d = new Date(iso + "T12:00:00"), t = new Date(todayISO() + "T12:00:00");
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return "Heute";
  if (diff === 1) return "Gestern";
  if (diff === 2) return "Vorgestern";
  if (diff > 0 && diff < 7) return WD[d.getDay()];
  return WD[d.getDay()].slice(0, 2) + ", " + dm(iso) + (d.getFullYear() !== t.getFullYear() ? d.getFullYear() : "");
};
const plain = n => (Math.round(n * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, c) => (Math.round(n * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + c;

/* ---------- Installation ---------- */
let installEvent = null;
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isSafari = () => /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|chrome/i.test(navigator.userAgent);

addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; if (load.offered) showInstall(); });
addEventListener("appinstalled", () => { hideInstall(); toast("Installiert. 🎉"); });

function showInstall(force) {
  if (installed() || pinResolve || !D) return;
  if (!force) {
    if (welcoming()) return;                          // erst "Wer bist du?", dann Installieren - nie beides übereinander
    const later = +localStorage.installLater || 0;
    if (Date.now() - later < 7 * 864e5) return;      // nach „Später" eine Woche Ruhe
    if (!installEvent && !isIos()) return;            // Browser ohne Dialog nicht belästigen
  }
  const box = document.getElementById("install");
  const head = `<div class="head"><img src="/icon-192.png?v=__V__" alt="">
    <div><h3 id="installTitle">Das Programm installieren</h3>
    <p>Als App auf dem Home-Bildschirm – mit Benachrichtigungen.</p></div></div>`;

  if (installEvent) {
    box.innerHTML = head +
      `<button onclick="doInstall()">Jetzt installieren</button>
       <button class="ghost" onclick="laterInstall(true)">Später</button>`;
  } else if (isIos()) {
    box.innerHTML = head +
      (isSafari() ? "" : `<p style="color:var(--warn);margin-top:10px">Das geht nur in Safari. Öffne diese Seite dort.</p>`) +
      `<ol><li>Unten auf <b>Teilen</b> tippen <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></li>
        <li><b>Zum Home-Bildschirm</b> wählen</li>
        <li>Rechts oben auf <b>Hinzufügen</b></li></ol>
       <div class="arrow">⬇︎</div>
       <button class="ghost" onclick="laterInstall(true)">Verstanden</button>`;
  } else {
    box.innerHTML = head +
      `<p style="margin-top:10px">In deinem Browser geht das über das Menü: <b>Zum Startbildschirm hinzufügen</b> bzw. <b>App installieren</b>.</p>
       <button class="ghost" onclick="laterInstall(true)">Verstanden</button>`;
  }
  box.classList.add("on"); focusSheet(box);
  document.getElementById("backdrop").classList.add("on");
}
// Kurze Erklärungen, dort wo die Frage aufkommt.
const INFOS = () => { const S = (D && D.settings) || {}; return {
  guthaben: ["So funktioniert das Guthaben", `
    <p>Wer mehr macht als das Wochenziel, sammelt Guthaben:</p>
    <ul>${(S.creditSteps || []).map((x, i) =>
      `<li>die <b>${S.required + i + 1}.</b> Einheit einer Woche bringt <b>${fmtCredits(x)}</b></li>`).join("")}
        <li>alles darüber bringt nichts mehr</li></ul>
    <p>Mehr als <b>${fmtCredits(S.creditMax)}</b> lassen sich nicht ansparen.</p>
    <p>Fehlt dir später eine Einheit, springen <b>${S.bonusCost} Guthaben</b> automatisch ein –
       aber nur, wenn sie zu dem Zeitpunkt schon da waren. Rückwirkend geht nichts.</p>
    <p>Eine ganze Woche lässt sich nie decken: mindestens ein eigener Eintrag muss
       stehen, Sport oder Krankmeldung. Wer eine Woche gar nichts macht, zahlt.</p>
    <p>Ihr könnt die Regel jederzeit wieder ausschalten – dann rechnet die Kasse
       sofort wieder ohne Guthaben, auch für die Wochen davor. Nichts geht kaputt.</p>`],
  kasse: ["Wie die Kasse funktioniert", `
    <p>Es gibt keinen Topf, in den jemand vorher einzahlt. Wer eine Woche verpasst,
       sammelt <b>Schulden</b> an – die stehen in der Spalte <b>Angesammelt</b>.</p>
    <p>Unternehmt ihr etwas und jemand bezahlt es, bucht er es über <b>Ausgabe buchen</b> auf sich.
       Der Betrag landet bei ihm unter <b>Gezahlt</b> und begleicht seine Schulden.</p>
    <p>Der <b>Saldo</b> ist die Differenz: ein Minus heißt, die Person schuldet der
       Gruppe noch etwas. Ein Plus heißt, sie hat mehr ausgelegt als fällig war –
       das holt sie beim nächsten Mal wieder rein.</p>
    <p>Die große Zahl oben ist, was insgesamt zusammengekommen und noch nicht
       ausgegeben ist. So viel könnt ihr also noch verplanen. Steht dort ein Minus,
       wurde schon mehr ausgelegt, als bisher zusammengekommen ist.</p>`],
  rangliste: ["So liest sich die Rangliste", `
    <p>Die Medaillen gehen nach <b>erfolgreich abgeschlossenen Wochen</b> – unabhängig davon,
       wonach die Tabelle gerade sortiert ist.</p>
    <p>Ein Tipp auf eine Spaltenüberschrift sortiert danach, ein zweiter Tipp dreht die Reihenfolge um.</p>
    <p>\u{1F525} ist die aktuelle Serie, <b>Rekord</b> die längste.${S.bonus
      ? ` ✨ ist das Guthaben; ${S.bonusCost} davon decken eine fehlende Einheit.` : ""}</p>`],
  woche: ["So liest sich die Wochenübersicht", `
    <p>Die drei kleinen Felder sind die Wochen davor, die Zahl darin die Einheiten.</p>
    <ul><li><b>gefüllt</b>: Ziel geschafft</li>
        <li><b>gestrichelt rot</b>: Ziel verpasst</li>
        <li><b>blass</b>: zählte für diese Person noch nicht</li></ul>
    <p>Unter „diese“ steht die laufende Woche, grün sobald das Ziel erreicht ist, daneben die Serie. 🤒 markiert eine Krankmeldung.</p>
    <p>Wer das Ziel verpasst, zahlt ${D ? money(S.fine, S.currency) : "den eingestellten Betrag"} in die Kasse.</p>`],
  anstupser: ["Wann die App sich meldet", `
    <p>Nur wenn du hinterherhinkst, und höchstens einmal je Gelegenheit:</p>
    <ul><li><b>Mitte der Woche</b>, wenn noch gar nichts steht – mal mittwochs, mal donnerstags,
            zwischen 11 und 14 Uhr</li>
        <li><b>zum Wochenende</b>, wenn noch etwas fehlt – freitags oder samstags vormittags</li>
        <li><b>sonntags</b> als letzte Erinnerung, bevor es Geld kostet</li></ul>
    <p>Wann genau, wechselt von Woche zu Woche. Wer sein Ziel hat, hört nichts.</p>
    <p>Der Text richtet sich nach deiner Serie, deinen Sportarten und – wenn du den
       Standort freigibst – nach dem Wetter.</p>`],
}; };

// Nachfrage in einem eigenen Fenster. Gibt ein Versprechen auf ja/nein zurueck.
// Nicht confirm(): das zeigt Chrome in einer installierten PWA nicht zuverlaessig
// an - dann wuerde kommentarlos geloescht.
let askResolve = null;
function ask(title, text, okText = "Löschen") {
  const box = document.getElementById("ask");
  box.innerHTML = `<h3>${title}</h3>${text}
    <div class="btns">
      <button class="ghost" onclick="askClose(false)">Abbrechen</button>
      <button class="warn" onclick="askClose(true)">${okText}</button>
    </div>`;
  box.classList.add("on"); focusSheet(box);
  document.getElementById("backdrop").classList.add("on");
  return new Promise(res => { askResolve = res; });
}
function askClose(answer) {
  const box = document.getElementById("ask");
  if (!box.classList.contains("on")) return;
  box.classList.remove("on");
  document.getElementById("backdrop").classList.remove("on"); restoreFocus();
  const r = askResolve; askResolve = null;
  if (r) r(!!answer);
}

function showInfo(key) {
  const [title, body] = INFOS()[key] || [];
  if (!title) return;
  const box = document.getElementById("info");
  box.innerHTML = `<h3>${title}</h3>${body}<button class="ghost" onclick="hideInfo()">Verstanden</button>`;
  box.classList.add("on"); focusSheet(box);
  document.getElementById("backdrop").classList.add("on");
}
function hideInfo() {
  if (!document.getElementById("info").classList.contains("on")) return;
  document.getElementById("info").classList.remove("on");
  document.getElementById("backdrop").classList.remove("on"); restoreFocus();
}
// Eigenes Fenster von unten fuer Menues und kurze Formulare - wie #info,
// nur mit beliebigem Inhalt.
function openSheet(html) {
  const box = document.getElementById("form");
  clearTimeout(closeSheet.t);
  box.innerHTML = html;
  box.classList.add("on"); focusSheet(box);
  document.getElementById("backdrop").classList.add("on");
}
function closeSheet() {
  const box = document.getElementById("form");
  if (!box.classList.contains("on")) return;
  box.classList.remove("on");
  document.getElementById("backdrop").classList.remove("on"); restoreFocus();
  // Inhalt nach dem Wegschieben leeren, damit keine Felder doppelt im Dokument stehen
  closeSheet.t = setTimeout(() => { if (!box.classList.contains("on")) box.innerHTML = ""; }, 350);
}
// Fokus wandert ins Fenster und beim Schließen zurück - fürs Vorlesen und für Tastaturen.
let lastFocus = null;
function focusSheet(box) {
  if (!lastFocus || !document.contains(lastFocus)) lastFocus = document.activeElement;
  try { box.focus({ preventScroll: true }); } catch {}
}
function restoreFocus() {
  const el = lastFocus; lastFocus = null;
  if (el && document.contains(el) && el.focus) try { el.focus({ preventScroll: true }); } catch {}
}
// Alle Fenster zu - beim Seitenwechsel und mit Escape. Eine offene Nachfrage
// gilt dabei als "Abbrechen", es wird also nie etwas ungefragt gelöscht.
const anySheetOpen = () => ["install", "info", "ask", "form"].some(id => document.getElementById(id)?.classList.contains("on"));
function closeAllSheets() {
  if (!anySheetOpen()) return;
  askClose(false); hideInfo(); closeSheet(); hideInstall();
}
const infoBtn = key => `<button class="i" title="Erklärung" onclick="showInfo('${key}')">i</button>`;
const fmtCredits = n => (Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".", ","));

function hideInstall() {
  if (!document.getElementById("install").classList.contains("on")) return;
  document.getElementById("install").classList.remove("on");
  document.getElementById("backdrop").classList.remove("on"); restoreFocus();
}
function laterInstall(remember) { if (remember) localStorage.installLater = Date.now(); hideInstall(); }
async function doInstall() {
  if (!installEvent) return hideInstall();
  hideInstall();
  const e = installEvent; installEvent = null;
  e.prompt();
  const { outcome } = await e.userChoice;
  if (outcome !== "accepted") localStorage.installLater = Date.now();
}

let D = null, busy = false;
let pin = localStorage.pin || "";
let me = +localStorage.me || 0;
const device = localStorage.device || (localStorage.device = (crypto.randomUUID ? crypto.randomUUID() : "d" + Date.now() + Math.random().toString(36).slice(2)));

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
// Fehler einer Aktion als Hinweis zeigen statt still zu schlucken.
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };

let pinResolve = null;
function askPin(wrong) {
  return new Promise(res => {
    pinResolve = res;
    document.body.classList.add("locked");
    $("#app").innerHTML = `<div class="card" style="margin-top:18vh;text-align:center">
      <div style="font-size:42px;line-height:1">🔒</div>
      <h2 style="text-align:center;margin-top:8px">Gruppen-PIN</h2>
      <div class="sub">${wrong ? '<span class="bad">Die PIN stimmt nicht.</span>'
        : "Einmalig eingeben – dieses Gerät merkt sie sich."}</div>
      <input id="pinIn" type="text" autocapitalize="characters" autocorrect="off" autocomplete="off"
        placeholder="PIN" style="text-align:center;letter-spacing:.35em;font-size:20px;text-transform:uppercase"
        onkeydown="if(event.key==='Enter')submitPin()">
      <button onclick="submitPin()">Weiter</button></div>`;
    setTimeout(() => $("#pinIn")?.focus(), 60);
  });
}
function submitPin() {
  const v = $("#pinIn").value.trim();
  if (!v) return;
  pin = v; localStorage.pin = v;
  document.body.classList.remove("locked");
  const done = pinResolve; pinResolve = null; done();
}

async function api(p, method = "GET", body, _retry = 0) {
  const r = await fetch("/api/" + p, {
    method,
    headers: { "content-type": "application/json", "x-pin": pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    await askPin(_retry > 0);
    return api(p, method, body, _retry + 1);
  }
  if (!r.ok && r.headers.get("content-type")?.includes("json")) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || "Fehler " + r.status);
  }
  if (!r.ok) throw new Error("Fehler " + r.status);
  return r;
}
const get = p => api(p).then(r => r.json());

async function load() {
  try {
    D = await get("state");
    if (me && !D.members.some(m => m.id === me)) { me = 0; localStorage.removeItem("me"); }
    render();
    if ($("#form")?.classList.contains("on")) paintComments();
    if (!load.offered) { load.offered = true; setTimeout(() => showInstall(), 1000); refreshLocation(); }
    catchUp();
  } catch (e) { $("#app").innerHTML = '<div class="card"><h2>Fehler</h2>' + esc(e.message) + '</div>'; }
}

// Beim Oeffnen der App im Hintergrund bei intervals.icu nachsehen. Wer gerade
// hochgeladen hat, sieht die Einheit damit sofort statt erst beim naechsten
// Lauf des Servers. Der Worker bremst zu haeufige Anfragen selbst ab.
let catchUpBusy = false;
async function catchUp() {
  if (catchUpBusy || !D || !me) return;
  if (!(D.links || []).some(l => l.member_id === me)) return;
  catchUpBusy = true;
  try {
    const r = await (await api("link/sync", "POST", { member_id: me, force: false })).json();
    if (r.imported && r.imported.length) {
      D = await get("state");
      render();
      toast(r.imported.length === 1 ? "Eine Einheit übernommen." : r.imported.length + " Einheiten übernommen.");
    }
  } catch {} finally { catchUpBusy = false; }
}

/* ---------- Auswertung ---------- */
const inWeek = (mid, w) => D.entries.filter(e => e.member_id === mid && weekOf(e.date) === w);
const done = (mid, w) => inWeek(mid, w).filter(e => e.kind !== "sick").length;
const sick = (mid, w) => inWeek(mid, w).filter(e => e.kind === "sick").reduce((a, e) => a + (e.units || 1), 0);
const credit = (mid, w) => done(mid, w) + Math.min(sick(mid, w), D.settings.sickMax ?? D.settings.required);

function weeksOf(member) {
  const s = D.settings;
  const from = weekOf((member.joined && member.joined > s.start) ? member.joined : s.start);
  const cur = weekOf(todayISO());
  const out = [];
  for (let w = from, i = 0; w < cur && i < 520; w = addW(w, 1), i++) out.push(w);
  return out;
}

/* Die Abrechnung (Strafen, Serie, Guthaben) rechnet der Worker - siehe stats.js. */

/* ---------- Start ---------- */
let kasseOpen = false;
function viewHome() {
  const s = D.settings, c = s.currency, cur = weekOf(todayISO());
  if (!D.members.length) return onboarding();
  const st = D.stats || {};
  const angesammelt = D.members.reduce((a, m) => a + st[m.id].owed, 0);
  const ausgegeben = D.expenses.reduce((a, x) => a + x.amount, 0);
  const kasse = angesammelt - ausgegeben;
  const ohnePerson = D.expenses.filter(x => !x.member_id).reduce((a, x) => a + x.amount, 0);
  const prev = [3, 2, 1].map(i => addW(cur, -i));
  // Medaillen gehen immer nach geschafften Wochen - unabhängig davon, wonach
  // gerade sortiert ist.
  const rang = new Map([...D.members]
    .sort((a, b) => st[b.id].weeksDone - st[a.id].weeksDone || st[b.id].sessions - st[a.id].sessions)
    .map((m, i) => [m.id, i]));
  const SPALTEN = {
    weeksDone: m => st[m.id].weeksDone,
    sessions: m => st[m.id].sessions,
    streak: m => st[m.id].streak,
    bestStreak: m => st[m.id].bestStreak,
  };
  const board = [...D.members].sort((a, b) => {
    const f = SPALTEN[boardSort.key] || SPALTEN.weeksDone;
    return (f(b) - f(a)) * boardSort.dir || rang.get(a.id) - rang.get(b.id);
  });
  const th = (key, label, titel) =>
    `<th class="sortable${boardSort.key === key ? " on" : ""}" title="${titel}" onclick="sortBoard('${key}')">${label}${
      boardSort.key === key ? (boardSort.dir === 1 ? " ↓" : " ↑") : ""}</th>`;

  if (!me && !lookOnly()) return welcome();

  // Eine Zeile je Person: die drei Wochen davor als Felder, dann die laufende Woche.
  const feld = (m, w) => {
    const cr = credit(m.id, w), counts = weeksOf(m).includes(w);
    const n = done(m.id, w) + (sick(m.id, w) ? "🤒" : "");
    if (!counts) return `<span class="cell na" title="Woche ab ${dm(w)}: zählte noch nicht">–</span>`;
    return cr >= s.required
      ? `<span class="cell ok" title="Woche ab ${dm(w)}: geschafft">${n}</span>`
      : `<span class="cell miss" title="Woche ab ${dm(w)}: verpasst">${n}</span>`;
  };
  // Spaltenköpfe mit Monat: "2.11." statt "02." - sonst weiß man nicht, welcher Monat.
  const kurz = w => +w.slice(8) + "." + +w.slice(5, 7) + ".";
  const woche = `<div class="card"><h2>Wochenstand <small>Ziel ${s.required} pro Woche</small>${infoBtn("woche")}</h2>
    <table class="wk">
      <tr><th></th>${prev.map(w => `<th class="nw">${kurz(w)}</th>`).join("")}<th class="nw" title="Woche ab ${dm(cur)}">diese</th><th>\u{1F525}</th></tr>
      ${D.members.map(m => {
        const d = done(m.id, cur), k = sick(m.id, cur), cr = credit(m.id, cur), ok = cr >= s.required;
        return `<tr><td class="nm">${esc(m.name)}${m.id === me ? ' <span class="chip">du</span>' : ""}</td>
          ${prev.map(w => `<td>${feld(m, w)}</td>`).join("")}
          <td class="now ${ok ? "ok" : ""}">${d}${k ? " +" + k + "🤒" : ""} / ${s.required}${ok ? " ✓" : ""}</td>
          <td>${st[m.id]?.streak || "–"}</td></tr>`;
      }).join("")}
    </table>
    <div class="legend-cells"><span><span class="cell ok">3</span>geschafft</span>
      <span><span class="cell miss">1</span>verpasst</span><span>Zahl = Einheiten der Woche</span></div></div>`;

  // Die Guthaben-Spalte nur, wenn jemand welches hat - eine Spalte voller Nullen sagt nichts.
  const showCredits = s.bonus && D.members.some(m => st[m.id].credits > 0);
  const rangliste = `<div class="card"><h2>Rangliste${infoBtn("rangliste")}</h2><div class="tbl-wrap"><table class="board">
    <tr><th></th>${th("weeksDone", "Wochen", "erfolgreich abgeschlossene Wochen")}
      ${th("sessions", "Einheiten", "Einheiten insgesamt")}
      ${th("streak", "\u{1F525}", "aktuelle Serie")}
      ${th("bestStreak", "Rekord", "längste Serie")}
      ${showCredits ? '<th title="Guthaben">✨</th>' : ""}</tr>
    ${board.map(m => {
      const b = st[m.id], i = rang.get(m.id);
      return `<tr><td class="who">${["🥇", "🥈", "🥉"][i] || i + 1 + "."}&nbsp;${esc(m.name)}</td>
        <td class="nw">${b.weeksDone}/${b.weeks}${b.saved ? ` <span class="ok" title="mit Guthaben gerettet">✨</span>` : ""}</td>
        <td>${b.sessions}</td><td>${b.streak || "–"}</td><td>${b.bestStreak || "–"}</td>
        ${showCredits ? `<td class="nw">${fmtCredits(b.credits)}</td>` : ""}</tr>`;
    }).join("")}
  </table></div></div>`;

  const saldo = b => `${b.balance > 0.004 ? "+" : ""}${plain(b.balance)}`;
  const meinSaldo = me && st[me]
    ? `<div class="mine"><span>Dein Saldo</span><b class="${st[me].balance < -0.004 ? "bad" : st[me].balance > 0.004 ? "ok" : ""}">${
        saldo(st[me])} ${esc(c)}</b></div>` : "";
  const kasseKarte = `<div class="card"><h2>Kasse${infoBtn("kasse")}</h2>
    <div class="flex" style="align-items:flex-end">
      <div><div class="big">${money(kasse, c)}</div>
        <div class="sub">${kasse >= 0 ? "noch zu verplanen" : "mehr ausgelegt als angesammelt"}</div></div>
      <button class="s" onclick="expenseSheet()">Ausgabe buchen</button></div>
    ${meinSaldo}
    <details class="more" ${kasseOpen ? "open" : ""} ontoggle="kasseOpen=this.open">
      <summary>Alle Personen</summary>
      <table style="margin-top:6px">
        <tr><th></th><th>Angesammelt</th><th>Gezahlt</th><th>Saldo</th></tr>
        ${D.members.map(m => {
          const b = st[m.id];
          return `<tr><td>${esc(m.name)}${m.id === me ? ' <span class="chip">du</span>' : ""}</td>
            <td class="nw">${plain(b.owed)}</td><td class="nw">${plain(b.settled)}</td>
            <td class="nw ${b.balance < -0.004 ? "bad" : b.balance > 0.004 ? "ok" : "sub"}">${saldo(b)}</td></tr>`;
        }).join("")}
        ${ohnePerson ? `<tr><td class="sub">ohne Person</td><td class="sub">–</td><td class="nw">${plain(ohnePerson)}</td><td class="sub">–</td></tr>` : ""}
      </table>
      <div class="hint">${money(angesammelt, c)} angesammelt, ${money(ausgegeben, c)} ausgegeben. Minus heißt: schuldet der Gruppe noch etwas.</div>
    </details>
  </div>`;

  return hero(st) + (installNudge() || pushNudge()) + woche + rangliste + kasseKarte;
}

// Oben steht, was antreibt: die eigene Serie und was diese Woche noch fehlt.
let celebrate = false;
function hero(st) {
  const s = D.settings;
  if (!me) return "";
  const mine = st[me];
  if (!mine) return "";
  const cr = mine.week.credit, left = mine.week.left, days = daysLeft();
  const pct = Math.min(100, s.required ? cr / s.required * 100 : 100);
  const headline = mine.streak
    ? `<div class="flame">🔥</div><div class="big">${mine.streak} ${mine.streak === 1 ? "Woche" : "Wochen"}</div><div class="sub">am Stück geschafft</div>`
    : `<div class="flame">💪</div><div class="big">Los geht's</div><div class="sub">Diese Woche startet deine Serie</div>`;
  const line = left === 0
    ? `Diese Woche erledigt · ${cr} ${cr === 1 ? "Einheit" : "Einheiten"}`
      + (mine.streak > 1 ? " · Serie hält" : "")
    : `Noch ${left} ${left === 1 ? "Einheit" : "Einheiten"} in ${days} ${days === 1 ? "Tag" : "Tagen"}`
      + ` · ${cr} von ${s.required}`;
  const bonus = s.bonus
    ? `<div class="sub" style="margin-top:10px;border-top:1px solid rgba(255,255,255,.25);padding-top:8px">
        ✨ <b>${fmtCredits(mine.credits)}</b> von ${mine.maxCredits || 9} Guthaben${
          mine.pending ? " (+" + fmtCredits(mine.pending) + " diese Woche)" : ""}
        ${mine.week.canRescue ? ` · ${mine.rescueCost} davon decken die Woche` : ""}${infoBtn("guthaben")}</div>`
    : "";
  const win = celebrate; celebrate = false;
  return `<div class="card hero${win ? " win" : ""}">${headline}
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub">${line}</div>${bonus}</div>`;
}

// Hinweise lassen sich fuer eine Woche wegtippen - nur die Anzeige, sonst nichts.
const snoozed = key => { try { return Date.now() - (+localStorage["hide_" + key] || 0) < 7 * 864e5; } catch { return false; } };
function snooze(key) { try { localStorage["hide_" + key] = Date.now(); } catch {} render(); }
const closeX = key => `<button class="x" title="Ausblenden" aria-label="Ausblenden" onclick="snooze('${key}')">✕</button>`;

// Steht da, solange die App im Browser statt vom Home-Bildschirm läuft.
function installNudge() {
  if (installed() || !("serviceWorker" in navigator) || snoozed("install")) return "";
  return `<div class="nudge"><div class="ic">\u{1F4F2}</div><div class="tx"><b>Auf den Home-Bildschirm</b>
    <div class="sub">Startet schneller, auf dem iPhone nur so mit Benachrichtigungen.</div></div>
    <button class="s" onclick="showInstall(true)">Installieren</button>${closeX("install")}</div>`;
}

// Bleibt stehen, bis Push auf diesem Gerät läuft.
function pushNudge() {
  if (localStorage.pushOn === "1" || snoozed("push")) return "";
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "";
  if (!D.vapidPublicKey) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (Notification.permission === "denied")
    return `<div class="nudge"><div class="ic">🔕</div><div class="tx"><b>Benachrichtigungen blockiert</b>
      <div class="sub">In den Browser-Einstellungen für diese Seite wieder erlauben.</div></div>${closeX("push")}</div>`;
  if (ios && !standalone)
    return `<div class="nudge"><div class="ic">🔔</div><div class="tx"><b>Benachrichtigungen</b>
      <div class="sub">Dafür die App erst zum Home-Bildschirm hinzufügen.</div></div>
      <button class="s" onclick="showInstall(true)">Wie?</button>${closeX("push")}</div>`;
  return `<div class="nudge"><div class="ic">🔔</div><div class="tx"><b>Benachrichtigungen einschalten</b>
    <div class="sub">Sonst verpasst du, wenn jemand einträgt.</div></div>
    <button class="s" onclick="togglePush()">Einschalten</button>${closeX("push")}</div>`;
}

/* ---------- Zahlen ---------- */
let R = null, reportFailed = false, statsWho = "me";
let boardSort = { key: "weeksDone", dir: 1 };   // dir 1 = größte zuerst
function sortBoard(key) {
  boardSort = boardSort.key === key ? { key, dir: -boardSort.dir } : { key, dir: 1 };
  render();
}

const loadReport = async () => {
  try {
    R = await (await api("report")).json();
    reportFailed = false;
  } catch (e) {
    reportFailed = true;
    toast(e.message);
  }
  render();
};

const nf = n => Number(n).toLocaleString("de-DE");
const seriesColor = i => "var(--s" + ((i % 8) + 1) + ")";

// Säulen: eine Reihe, Zahl über der Säule, gestrichelte Ziellinie.
// items: [{ label, value, tip, now }] - now: die laufende Woche, die noch nicht vorbei ist.
function colBars(items, goal) {
  const max = Math.max(goal, ...items.map(x => x.value), 1);
  return `<div class="vbars${goal ? " has-goal" : ""}">${items.map((x, i) => {
    const met = goal ? x.value >= goal : x.value > 0;
    const h = (x.value / max) * 100;
    // Eine angefangene Woche ist nicht verfehlt - sie läuft noch. Umrandet statt grau.
    const cls = met ? "" : x.now ? "now" : "q";
    return `<div class="vbar" data-tip="${esc(x.tip)}"><div class="plot">
      <i class="${cls}" style="height:${h}%"></i>${x.value ? `<em style="bottom:calc(${h}% + 2px)">${x.value}</em>` : ""}
      ${goal ? goalMark(goal, max, i === items.length - 1) : ""}</div>
      <u>${esc(x.label)}</u>${x.month !== undefined ? `<u class="mo">${esc(x.month)}</u>` : ""}</div>`;
  }).join("")}</div>`;
}
// Das Ziel als Strich über jeder Säule. Gleiche Ziele nebeneinander ergeben eine
// durchgehende Linie; ändert sich das Ziel (jemand kommt dazu), macht sie eine Stufe.
// Die Beschriftung steht rechts neben der letzten Säule - nie über einer Säule.
const goalMark = (goal, max, last) =>
  `<span class="goal" style="bottom:${(goal / max) * 100}%">${last ? `<b>Ziel ${goal}</b>` : ""}</span>`;
// Monat nur dort, wo er wechselt - sonst weiß man bei "07." nicht, ob September oder Oktober.
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const monthMarks = weeks => weeks.map((w, i) => {
  const m = +w.slice(5, 7), prev = i ? +weeks[i - 1].slice(5, 7) : 0;
  return m !== prev ? MON[m - 1] : "";
});

const asWeeks = weeks => weeks.map((w, i, all) => ({
  label: w.week.slice(8) + ".",
  month: monthMarks(all.map(x => x.week))[i],
  value: w.units,
  now: w.week === weekOf(todayISO()),
  tip: "Woche ab " + dm(w.week) + " · " + w.units + " " + (w.units === 1 ? "Einheit" : "Einheiten")
    + (w.week === weekOf(todayISO()) ? " · läuft noch" : ""),
}));
// Gruppenziel je Woche: Ziel mal alle, die in dieser Woche schon mitgezählt haben.
const teamGoals = weeks => weeks.map(w => R.required * D.members.filter(m =>
  weekOf(m.joined && m.joined > D.settings.start ? m.joined : D.settings.start) <= w.week).length);

// Gestapelte Säulen: ein Segment je Person, 2 px Fuge dazwischen.
// goals: das Gruppenziel je Woche - es zählen nur die, die in der Woche schon dabei waren.
function stackBars(stacked, people, goals) {
  const totals = stacked.map(w => Object.values(w.byMember).reduce((a, b) => a + b, 0));
  const max = Math.max(...goals, ...totals, 1);
  const months = monthMarks(stacked.map(w => w.week));
  const any = goals.some(Boolean);
  return `<div class="vbars${any ? " has-goal" : ""}">${stacked.map((w, wi) => {
    const parts = people.map((p, i) => ({ p, i, n: w.byMember[p.id] || 0 })).filter(x => x.n);
    const names = parts.map(x => x.p.name + ": " + x.n).join(" · ");
    const h = (totals[wi] / max) * 100;
    return `<div class="vbar" data-tip="Woche ab ${esc(dm(w.week))} · ${totals[wi]} gesamt${goals[wi] ? " · Ziel " + goals[wi] : ""}${names ? " · " + esc(names) : ""}"><div class="plot">
      <div class="vstack" style="height:${h}%">
        ${parts.map(x => `<i style="height:${(x.n / totals[wi]) * 100}%;background:${seriesColor(x.i)}"></i>`).join("")}
      </div>${totals[wi] ? `<em style="bottom:calc(${h}% + 2px)">${totals[wi]}</em>` : ""}
      ${goals[wi] ? goalMark(goals[wi], max, wi === stacked.length - 1) : ""}</div>
      <u>${w.week.slice(8)}.</u><u class="mo">${months[wi]}</u></div>`;
  }).join("")}</div>`;
}

// Balken: Name links, Zahl rechts - Farbe trägt nie allein die Bedeutung.
function rowBars(rows) {
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map(r => `<div class="hbar" data-tip="${esc(r.tip || r.label + ": " + r.value)}">
    <span class="nm">${esc(r.label)}</span>
    <div class="tr"><i style="width:${Math.max(3, (r.value / max) * 100)}%${r.color ? ";background:" + r.color : ""}"></i></div>
    <span class="vl">${esc(r.right)}</span></div>`).join("");
}

function viewStats() {
  if (!D.members.length) return onboarding();
  if (!R) {
    if (!reportFailed) loadReport();
    return reportFailed
      ? `<div class="card"><h2>Zahlen</h2><div class="sub">Konnte nicht geladen werden.</div>
         <button class="ghost" onclick="reportFailed=false;render()">Noch einmal versuchen</button></div>`
      : `<div class="card" aria-busy="true"><div class="tiles">${'<div class="skel" style="height:64px"></div>'.repeat(4)}</div></div>
         <div class="card"><div class="skel skel-line" style="width:45%"></div><div class="skel" style="height:110px;margin-top:14px"></div></div>`;
  }

  const mine = statsWho === "me" && me && R.members[me];
  const d = mine || R.team;
  const title = mine ? D.members.find(m => m.id === me)?.name : "Die Gruppe";
  const people = R.team.perMember;

  const toggle = `<div class="seg">
    <button class="${statsWho === "me" ? "on" : ""}" onclick="statsWho='me';render()">Ich</button>
    <button class="${statsWho === "team" ? "on" : ""}" onclick="statsWho='team';render()">Team</button></div>`;

  const noMe = statsWho === "me" && !me
    ? `<div class="card"><h2>Wer bist du?</h2><div class="sub">Unter Mehr → Ich und dieses Gerät oder auf der Startseite einmal auswählen, dann stehen hier deine Zahlen.</div></div>`
    : "";

  // Nur Kennzahlen, die jeder Eintrag hat - Dauer und Strecke sind freiwillig,
  // Summen daraus wären bei jedem Eintrag ohne Messwerte zu klein.
  const tiles = `<div class="card"><h2>${esc(title)} · seit ${d.first ? dm(d.first) : "Beginn"}</h2>
    <div class="tiles">
      <div class="tile"><b>${nf(d.sessions)}</b><span>Einheiten</span></div>
      <div class="tile"><b>${nf(d.sportCount)}</b><span>${d.sportCount === 1 ? "Sportart" : "Sportarten"}</span></div>
      <div class="tile"><b>${nf(d.together)}</b><span>gemeinsam</span></div>
      <div class="tile"><b>${nf(d.activeDays)}</b><span>aktive Tage</span></div>
    </div>
    <div class="hint">${mine
      ? "Gemeinsam: Einheiten, die du mit anderen aus der Gruppe gemacht hast."
      : "Gemeinsam: Einheiten, bei denen mehrere aus der Gruppe dabei waren – zählt einmal, egal wie viele."}</div></div>`;

  const nameOf = id => people.find(p => p.id === id)?.name || "";
  const dur = s => s >= 3600 ? Math.floor(s / 3600) + ":" + String(Math.round(s % 3600 / 60)).padStart(2, "0") + " h" : Math.round(s / 60) + " min";
  const wer = x => [mine ? "" : nameOf(x.member_id), x.sport, dm(x.date)].filter(Boolean).map(esc).join(" · ");
  const marken = [
    d.longestKm && [ "Längste Strecke", nf(d.longestKm.value) + " km", wer(d.longestKm) ],
    d.longestTime && [ "Längste Einheit", dur(d.longestTime.value), wer(d.longestTime) ],
    d.bestWeek && [ "Stärkste Woche", d.bestWeek.units + " " + (d.bestWeek.units === 1 ? "Einheit" : "Einheiten"), "ab " + dm(d.bestWeek.week) ],
  ].filter(Boolean);
  const bestmarken = marken.length ? `<div class="card"><h2>Bestmarken</h2><table>
    ${marken.map(([k, v, w]) => `<tr><td>${k}</td><td><b>${v}</b><div class="sub">${w}</div></td></tr>`).join("")}
    </table>${d.longestKm || d.longestTime ? `<div class="hint">Strecke und Dauer nur aus Einträgen, bei denen sie eingetragen sind.</div>` : ""}</div>` : "";

  const verlauf = `<div class="card"><h2>Einheiten je Woche</h2>
    ${mine ? colBars(asWeeks(d.weeks), R.required) : stackBars(R.team.stacked, people, teamGoals(R.team.stacked))}
    ${mine ? "" : `<div class="legend">${people.slice(0, 8).map((p, i) =>
      `<span><b style="background:${seriesColor(i)}"></b>${esc(p.name)}</span>`).join("")}</div>`}
    <div class="hint">Die letzten ${d.weeks.length} Wochen. ${mine
      ? "Graue Säulen haben das Ziel verfehlt." + (d.weeks.some(w => w.week === weekOf(todayISO()) && w.units < R.required)
          ? " Die umrandete ist die laufende Woche." : "")
      : `Die Linie ist das Ziel der ganzen Gruppe: ${R.required} je Person, die in der Woche schon dabei war.`}</div>
    <details class="more"><summary>Wochen als Tabelle</summary><div class="tbl-wrap"><table style="margin-top:6px">
      ${mine
        ? `<tr><th>Woche ab</th><th>Einheiten</th><th>Ziel</th></tr>${[...d.weeks].reverse().map(w =>
            `<tr><td>${dm(w.week)}</td><td>${w.units}</td><td>${w.units >= R.required ? "✓ geschafft" : "– verfehlt"}</td></tr>`).join("")}`
        : `<tr><th>Woche ab</th>${people.slice(0, 8).map(p => `<th>${esc(p.name)}</th>`).join("")}<th>Gesamt</th></tr>${
            [...R.team.stacked].reverse().map(w => `<tr><td>${dm(w.week)}</td>${people.slice(0, 8).map(p =>
              `<td>${w.byMember[p.id] || "–"}</td>`).join("")}<td><b>${Object.values(w.byMember).reduce((a, b) => a + b, 0)}</b></td></tr>`).join("")}`}
    </table></div></details></div>`;

  const sportarten = d.sports.length ? `<div class="card"><h2>Sportarten</h2>
    ${rowBars(d.sports.map(sp => ({
      label: sportIcon(sp.sport) + " " + sp.sport,
      value: sp.count,
      right: sp.count + "×",
      tip: sp.sport + ": " + sp.count + " " + (sp.count === 1 ? "Einheit" : "Einheiten")
        + (mine ? "" : " · " + sp.people + " " + (sp.people === 1 ? "Person" : "Personen")),
    })))}
    ${d.moreSports ? `<div class="hint">und ${d.moreSports} weitere</div>` : ""}</div>` : "";

  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const WDL = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
  const bestDay = d.weekdays.indexOf(Math.max(...d.weekdays));
  const tage = d.sessions ? `<div class="card"><h2>Lieblingstage</h2>
    ${colBars(d.weekdays.map((n, i) => ({
      label: WD[i], value: n,
      tip: WDL[i] + " · " + n + " " + (n === 1 ? "Einheit" : "Einheiten"),
    })), 0)}
    <div class="hint">Am häufigsten: ${WDL[bestDay]}.</div></div>` : "";

  const leute = !mine && people.length ? `<div class="card"><h2>Wer wie viel</h2>
    ${rowBars([...people].sort((a, b) => b.sessions - a.sessions).map(p => ({
      label: p.name,
      value: p.sessions,
      color: seriesColor(people.findIndex(x => x.id === p.id)),
      right: p.sessions + "×",
      tip: p.name + ": " + p.sessions + " Einheiten · " + p.sportCount + " " + (p.sportCount === 1 ? "Sportart" : "Sportarten"),
    })))}
    </div>` : "";

  const tabelle = `<div class="card"><h2>Als Tabelle</h2><table>
    <tr><th>Sportart</th><th>Einheiten</th>${mine ? "" : "<th>Personen</th>"}</tr>
    ${d.sports.map(sp => `<tr><td>${esc(sp.sport)}</td><td>${sp.count}</td>${mine ? "" : `<td>${sp.people}</td>`}</tr>`).join("")}
  </table></div>`;

  return toggle + noMe + (statsWho === "me" && !me ? "" : tiles + bestmarken + verlauf + sportarten + tage + leute + tabelle);
}

/* ---------- Feed ---------- */
let filterOpen = false, feedFilter = { member: 0, sport: "" }, feedDays = 14;

const setFilter = (key, value) => { feedFilter[key] = value; render(); };
const clearFilter = () => { feedFilter = { member: 0, sport: "" }; filterOpen = false; render(); };
const filterActive = () => !!(feedFilter.member || feedFilter.sport);

// Die Leiste bleibt eine schmale Zeile, bis jemand sie aufklappt.
function filterBar(sportsInFeed) {
  if (!filterOpen && !filterActive())
    return `<div class="feedbar">${planOpen ? "<span></span>" : `<button class="pl" onclick="planOpen=true;render()">\u{1F4C5} Gemeinsame Einheit vorschlagen</button>`}
      <button onclick="filterOpen=true;render()">⌕ Filtern</button></div>`;

  const mine = feedFilter.member;
  return `<div class="card" style="padding:12px 14px">
    <div class="flex"><b style="font-size:14px">Feed filtern</b>
      <button class="x" onclick="clearFilter()" title="Filter aufheben">✕</button></div>
    <div class="row">
      <select onchange="setFilter('member', +this.value)">
        <option value="0">alle Personen</option>
        ${D.members.map(m => `<option value="${m.id}"${m.id === mine ? " selected" : ""}>${esc(m.name)}</option>`).join("")}
      </select>
      <select onchange="setFilter('sport', this.value)">
        <option value="">alle Sportarten</option>
        ${sportsInFeed.map(sp => `<option value="${esc(sp)}"${sp === feedFilter.sport ? " selected" : ""}>${esc(sp)}</option>`).join("")}
      </select>
    </div></div>`;
}

function viewFeed() {
  if (!D.members.length) return onboarding();
  const nameOf = id => D.members.find(m => m.id === id)?.name || "?";
  if (!D.entries.length && !(D.plans || []).length && !(D.events || []).length && !filterActive())
    return planCards() + filterBar([]) + `<div class="card empty"><div class="ic">\u{1F45F}</div><b>Noch ist es still hier</b>
      <div class="sub">Wer als Erstes etwas einträgt, setzt den Ton für die Woche.</div>
      <button onclick="location.hash='#add'">Erste Einheit eintragen</button></div>`;

  // Eintraege einer gemeinsamen Einheit zu einem Beitrag zusammenfassen
  const merged = [];
  const seen = new Map();
  for (const e of D.entries) {                 // absteigend nach id: die eintragende Person kommt zuletzt
    const known = e.group_id && seen.get(e.group_id);
    if (known) {
      known.crew.unshift(e.member_id);
      known.key = Math.min(known.key, e.id);
      if (e.hasPhoto) { known.hasPhoto = 1; known.photoId = e.id; }  // Foto haengt am Eintrag des Eintragenden
      continue;
    }
    const post = { ...e, crew: [e.member_id], photoId: e.id, key: e.id };
    if (e.group_id) seen.set(e.group_id, post);
    merged.push(post);
  }

  const sportsInFeed = [...new Set(D.entries.map(e => e.sport).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
  const passt = (e) => {
    if (feedFilter.member && !(e.isEvent ? e.member_id === feedFilter.member : e.crew.includes(feedFilter.member))) return false;
    if (feedFilter.sport && (e.isEvent || e.sport !== feedFilter.sport)) return false;
    return true;
  };

  const all = [...merged, ...(D.events || [])
      .filter(ev => D.members.some(m => m.id === ev.member_id))   // Teilnehmer gelöscht
      .map(ev => ({ ...ev, isEvent: true }))]
    .filter(passt)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id || 0) - (a.id || 0)));

  // Erst die letzten Wochen zeichnen, Älteres auf Wunsch. Die Daten sind
  // ohnehin alle da - es wird nur weniger auf einmal gezeigt.
  const cutoff = (() => { const d = new Date(todayISO() + "T12:00:00"); d.setDate(d.getDate() - feedDays + 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); })();
  const shown = filterActive() ? all : all.filter((e, i) => i < 10 || e.date >= cutoff);
  const rest = all.length - shown.length;
  const days = [];
  for (const e of shown) {
    if (!days.length || days[days.length - 1].date !== e.date) days.push({ date: e.date, items: [] });
    days[days.length - 1].items.push(e);
  }
  const leer = !all.length
    ? `<div class="card"><h2>Nichts gefunden</h2><div class="sub">Mit diesem Filter steht hier nichts.</div>
       <button class="ghost" onclick="clearFilter()">Filter aufheben</button></div>` : "";

  const older = rest ? `<button class="ghost" onclick="feedDays+=14;render()">Ältere anzeigen (${rest})</button>` : "";
  return planCards() + filterBar(sportsInFeed) + leer + days.map(d => `<div class="day">${relDay(d.date)}</div>` + d.items.map(e => {
    if (e.isEvent) {
      const who = D.members.find(m => m.id === e.member_id);
      return `<div class="post plan"><div class="act">✨ <b>Guthaben</b> <span class="sub">für ${esc(who.name)}</span></div>
        <div class="sub" style="margin-top:3px">${esc(e.text)}</div></div>`;
    }
    const names = e.crew.map(nameOf);
    const n = names.length > 1 ? names.slice(0, -1).join(", ") + " & " + names[names.length - 1] : names[0];
    const meta = e.meta ? Object.entries(JSON.parse(e.meta)) : [];
    return `<div class="post">
      <div class="who"><div class="av"${names.length > 1 ? "" : avatarStyle(e.crew[0])}>${names.length > 1 ? names.length : esc(names[0].slice(0, 1).toUpperCase())}</div>
        <div style="flex:1;min-width:0"><b>${esc(n)}</b>${e.crew.includes(me) ? ' <span class="chip">du</span>' : ""}
          ${names.length > 1 ? '<div class="sub">zusammen unterwegs</div>' : ""}</div>
        <button class="x more-btn" onclick="postMenu(${e.id})" title="Aktionen" aria-label="Aktionen">\u22EF</button></div>
      <div class="act">${e.kind === "sick"
        ? "🤒 Krankmeldung (" + (e.units || 1) + " " + ((e.units || 1) === 1 ? "Einheit" : "Einheiten") + ")"
        : sportIcon(e.sport) + " <b>" + (e.sport ? esc(e.sport) : "Sporteinheit") + "</b>"}</div>
      ${e.note ? `<div class="sub" style="margin-top:3px">${esc(e.note)}</div>` : ""}
      ${metrics(meta)}
      ${e.hasPhoto ? `<img class="ph" loading="lazy" data-photo="${e.photoId || e.id}" alt="">` : ""}
      ${socialBar(e)}
    </div>`;
  }).join("")).join("") + older;
}

/* ---------- Kudos und Kommentare ---------- */
// Beides haengt am Beitrag: bei gemeinsamen Einheiten am Eintrag der Person,
// die eingetragen hat (kleinste id). Der Worker legt es genauso ab.
const kudosOf = key => (D.kudos || []).filter(k => k.entry_id === key).map(k => k.member_id);
const commentsOf = key => (D.comments || []).filter(c => c.entry_id === key);
const nameOfId = id => D.members.find(m => m.id === id)?.name || "?";
const listNames = names => names.length > 1 ? names.slice(0, -1).join(", ") + " und " + names[names.length - 1] : (names[0] || "");
function ago(iso) {
  const t = Date.parse(iso || "");
  if (!t) return "";
  const min = Math.round((Date.now() - t) / 60000);
  if (min < 1) return "gerade";
  if (min < 60) return `vor ${min} Min.`;
  if (min < 24 * 60) return `vor ${Math.round(min / 60)} Std.`;
  return relDay(new Date(t - new Date(t).getTimezoneOffset() * 60000).toISOString().slice(0, 10));
}
const cmtHtml = c => `<b>${esc(nameOfId(c.member_id))}</b><span class="tx">${esc(c.text)}</span><span class="when">${esc(ago(c.created))}</span>`;
function socialBar(e) {
  const key = e.key || e.id;
  const ks = kudosOf(key), cs = commentsOf(key);
  const own = e.crew.includes(me);
  const given = ks.includes(me);
  // Kudos gibt es für Sport, nicht für Krankmeldungen - und nicht für die eigene Einheit.
  const kBtn = e.kind === "sick" || own ? "" :
    `<button class="kb${given ? " on" : ""}" data-kudos="${key}" onclick="toggleKudos(${key})" aria-pressed="${given}"
      aria-label="Kudos${ks.length ? ", bisher " + ks.length : ""}">👏 <span class="kn">Kudos${ks.length ? " · " + ks.length : ""}</span></button>`;
  const cBtn = `<button onclick="openComments(${key})" aria-label="Kommentieren${cs.length ? ", " + cs.length + " Kommentare" : ""}">💬 <span>${cs.length ? "Kommentare · " + cs.length : "Kommentieren"}</span></button>`;
  const from = ks.length
    ? `<div class="kfrom">👏 ${given && !own ? (ks.length === 1 ? "Du" : "Du und " + listNames(ks.filter(x => x !== me).map(nameOfId)))
        : listNames(ks.map(nameOfId))}${own ? (e.crew.length > 1 ? " feiern eure Einheit" : (ks.length === 1 ? " feiert deine Einheit" : " feiern deine Einheit")) : ""}</div>` : "";
  const last = cs.slice(-2);
  const cm = cs.length ? `<div class="cmts">${last.map(c => `<div class="cmt">${cmtHtml(c)}</div>`).join("")}
      ${cs.length > 2 ? `<button class="link" onclick="openComments(${key})">Alle ${cs.length} Kommentare</button>` : ""}</div>` : "";
  return `<div class="social">${kBtn}${cBtn}</div>${from}${cm}`;
}
const toggleKudos = guard(async key => {
  if (!me) return toast("Erst auswählen, wer du bist (Mehr → Ich und dieses Gerät).");
  const list = D.kudos || (D.kudos = []);
  const i = list.findIndex(k => k.entry_id === key && k.member_id === me);
  const off = i >= 0;
  if (off) list.splice(i, 1); else list.push({ entry_id: key, member_id: me });
  render();
  const btn = document.querySelector(`[data-kudos="${key}"]`);
  if (btn) { try { btn.focus({ preventScroll: true }); } catch {} if (!off) btn.classList.add("pop"); }
  try { await api(`entry/${key}/kudos`, "POST", { member_id: me, off, device }); }
  catch (e) { await load(); throw e; }
});

// Kommentare im eigenen Fenster: alle lesen, selbst schreiben, eigene löschen.
let commentsFor = null, cmtAsk = null;
function openComments(key) {
  const e = D.entries.find(x => x.id === key);
  if (!e) return toast("Eintrag nicht gefunden.");
  commentsFor = key; cmtAsk = null;
  const crew = e.group_id ? D.entries.filter(x => x.group_id === e.group_id).map(x => x.member_id) : [e.member_id];
  const was = e.kind === "sick" ? "Krankmeldung" : (e.sport || "Sporteinheit");
  openSheet(`<h3>${e.kind === "sick" ? "🤒" : sportIcon(e.sport)} ${esc(was)}</h3>
    <div class="sub">${esc(listNames(crew.map(nameOfId)))} · ${relDay(e.date)}</div>
    <div class="cmtlist" id="cmtList"></div>
    ${me ? `<label for="cmtText">Dein Kommentar</label>
      <textarea id="cmtText" maxlength="500" placeholder="${e.kind === "sick" ? "Gute Besserung!" : "Stark! 💪"}"></textarea>
      <button id="cmtSend" onclick="sendComment()">Senden</button>`
      : `<div class="sub" style="margin:10px 0">Zum Kommentieren erst auswählen, wer du bist (Mehr → Ich und dieses Gerät).</div>`}
    <button class="ghost" onclick="closeSheet()">Schließen</button>`);
  paintComments();
  setTimeout(() => $("#cmtText")?.focus(), 350);
}
function paintComments() {
  const box = $("#cmtList");
  if (!box || commentsFor == null) return;
  const cs = commentsOf(commentsFor);
  box.innerHTML = cs.length ? cs.map(c => `<div class="cmt"><div>${cmtHtml(c)}
      ${cmtAsk === c.id ? `<div class="sure"><button class="warn" onclick="delComment(${c.id})">Löschen</button>
        <button class="ghost" onclick="cmtAsk=null;paintComments()">Behalten</button></div>` : ""}</div>
      ${c.member_id === me && cmtAsk !== c.id ? `<button class="x" onclick="cmtAsk=${c.id};paintComments()" title="Kommentar löschen" aria-label="Kommentar löschen">✕</button>` : ""}</div>`).join("")
    : `<div class="sub">Noch keine Kommentare. Sag als Erstes was dazu.</div>`;
}
const sendComment = guard(async () => {
  const field = $("#cmtText"), btn = $("#cmtSend");
  const text = (field?.value || "").trim();
  if (!text) return field?.focus();
  if (btn) btn.disabled = true;
  try {
    const r = await api(`entry/${commentsFor}/comment`, "POST", { member_id: me, text, device }).then(r => r.json());
    (D.comments || (D.comments = [])).push({ id: r.id, entry_id: r.entry_id, member_id: me, text, created: new Date().toISOString() });
    field.value = "";
    paintComments(); render();
  } finally { if (btn) btn.disabled = false; }
});
const delComment = guard(async id => {
  await api("comment/" + id, "DELETE");
  D.comments = (D.comments || []).filter(c => c.id !== id);
  cmtAsk = null; paintComments(); render();
});

// Messwerte: die drei wichtigsten groß, der Rest klein darunter. Die Werte
// selbst kommen unverändert aus der Datei bzw. von intervals.icu.
const MAIN_METRICS = ["Distanz", "Dauer", "Tempo", "Schnitt"];
function metrics(meta) {
  if (!meta.length) return "";
  const main = meta.filter(([k]) => MAIN_METRICS.includes(k)).slice(0, 3);
  const rest = meta.filter(x => !main.includes(x));
  const big = main.length ? `<div class="mrow">${main.map(([k, v]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("")}</div>` : "";
  const small = rest.length ? `<div class="mmore">${rest.map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</div>` : "";
  return big + small;
}

// Feste Farbe je Person - dieselbe Reihenfolge wie in den Diagrammen.
// Ab neun Personen bleibt es beim Grün, statt Farben doppelt zu vergeben.
const AV_TEXT = ["#fff", "#0b1220", "#0b1220", "#0b1220", "#0b1220", "#fff", "#fff", "#0b1220"];
function avatarStyle(memberId) {
  const i = D.members.findIndex(m => m.id === memberId);
  if (i < 0 || D.members.length > 8) return "";
  return ` style="background:${seriesColor(i)};color:${AV_TEXT[i]}"`;
}

// Ändern, Foto und Löschen hinter einem Knopf - nicht mehr offen an jedem Beitrag.
function postMenu(id) {
  const e = D.entries.find(x => x.id === id);
  if (!e) return toast("Eintrag nicht gefunden.");
  // Das Foto haengt bei gemeinsamen Einheiten am Eintrag des Eintragenden.
  const crew = e.group_id ? D.entries.filter(x => x.group_id === e.group_id) : [e];
  const withPhoto = crew.find(x => x.hasPhoto);
  const photoId = withPhoto ? withPhoto.id : e.id;
  const was = e.kind === "sick" ? "Krankmeldung" : (e.sport || "Sporteinheit");
  openSheet(`<div class="actions"><h3>${esc(was)}</h3><div class="sub">${relDay(e.date)}</div>
    <button onclick="closeSheet();editEntry(${id})">✎ Ändern</button>
    ${e.kind === "sick" ? "" : `<button onclick="closeSheet();pickPhoto(${photoId})">📷 ${withPhoto ? "Foto tauschen" : "Foto hinzufügen"}</button>`}
    <button class="del" onclick="closeSheet();delEntry(${id})">✕ Löschen</button>
    <button class="ghost" style="justify-content:center" onclick="closeSheet()">Abbrechen</button></div>`);
}

function onboarding() {
  return `<div class="card"><h2>Los geht's</h2>
    <div class="sub">Trag einmal alle Teilnehmer ein – danach wählt jeder auf seinem Handy nur noch sich selbst aus.</div>
    <input id="names" placeholder="Anna, Ben, Chris, Dani">
    <button onclick="setupMembers()">Teilnehmer anlegen</button></div>`;
}
async function setupMembers() {

// Bis eine Person gewählt ist, zeigt Start nur diese eine Frage.
const lookOnly = () => { try { return sessionStorage.lookOnly === "1"; } catch { return false; } };
function welcome() {
  return `<div class="card welcome"><img src="/icon-192.png?v=__V__" alt="">
    <h2>Wer bist du?</h2>
    <div class="sub">Einmal auswählen – dieses Handy merkt sich das. Kein Konto, kein Passwort.</div>
    <div class="seg who">${D.members.map(m => `<button onclick="pickMe(${m.id})">${esc(m.name)}</button>`).join("")}</div>
