<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Das Programm</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Das Programm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg?v=__V__" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png?v=__V__">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --fg:#0b1220; --mut:#667085; --line:#e4e8ef;
  --acc:#16a34a; --accd:#15803d; --bad:#dc2626; --warn:#d97706; --chip:#eef2f7;
  --field:#f7f9fc; --fieldline:#c3ccda; --focus:#16a34a33;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1220; --card:#151d2e; --fg:#eef2f7; --mut:#9aa7bd; --line:#2b3850; --chip:#1f2b40;
         --field:#0d1526; --fieldline:#3b4a66; --focus:#22c55e40; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--fg);
  padding:max(10px,env(safe-area-inset-top)) 0 calc(76px + env(safe-area-inset-bottom));
}
main{max-width:620px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:19px;margin:0;letter-spacing:-.01em}
header .dot{width:30px;height:30px;border-radius:9px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td,th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:left;font-weight:600}
.ok{color:var(--acc)} .bad{color:var(--bad)} .warn{color:var(--warn)}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border-radius:12px;
  border:1.5px solid var(--fieldline);background:var(--field);color:var(--fg);margin:5px 0;appearance:none}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.75}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--focus)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=date],input[type=time]{min-height:46px}
input[type=file]{padding:9px 12px;border-style:dashed;color:var(--mut)}
input[type=file]::file-selector-button{font:inherit;font-weight:600;margin-right:10px;padding:7px 12px;
  border:0;border-radius:9px;background:var(--chip);color:var(--fg)}
button{font:inherit;width:100%;padding:12px 13px;border-radius:12px;border:0;background:var(--card);color:var(--fg);margin:5px 0;appearance:none}
textarea{min-height:64px;resize:vertical}
button{background:var(--acc);color:#fff;border:0;font-weight:700;cursor:pointer}
button.ghost{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
button.s{border:1px solid var(--line)}
button:active{background:var(--accd)}
button.ghost{background:var(--chip);color:var(--fg)}
button.s{width:auto;padding:8px 12px;font-size:14px;background:var(--chip);color:var(--fg);font-weight:600}
button.x{width:auto;padding:6px 10px;background:transparent;color:var(--mut);font-size:16px}
label{font-size:13px;color:var(--mut);display:block;margin-top:14px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;margin:4px 0}
.row>.x,.row>.s{flex:0 0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav a b{display:block;font-size:19px;font-weight:400;line-height:1.3}
nav a.on{color:var(--acc)}
body.locked nav,body.locked #install,body.locked #backdrop{display:none}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.chip{display:inline-block;background:var(--chip);color:var(--mut);border-radius:999px;padding:2px 9px;font-size:12px;margin:3px 4px 0 0}
img.ph{width:100%;max-height:46vh;object-fit:cover;border-radius:12px;margin-top:8px;display:block;background:var(--chip)}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;background:var(--chip);color:var(--fg);font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.flex{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* Reihenfarben: geprüfte Standardpalette, feste Reihenfolge, nie durchgewechselt.
   Dunkle Stufen sind dieselben Farbtöne, für die dunkle Fläche neu abgestuft. */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
      --s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
      --bar:#16a34a;--barq:#cbd5e1}
@media(prefers-color-scheme:dark){:root{
      --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
      --s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
      --bar:#22c55e;--barq:#334155}}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--chip);border-radius:12px;padding:11px 12px}
.tile b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tile span{font-size:12px;color:var(--mut)}

.vbars{display:flex;align-items:flex-end;gap:4px;height:124px;position:relative;margin:14px 0 2px;padding-top:16px}
.vbars .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--mut);opacity:.75}
.vbars .goal em{position:absolute;right:0;top:-15px;font-size:10px;font-style:normal;color:var(--mut);background:var(--card);padding:0 3px}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;cursor:default}
.vbar i{display:block;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.vbar i.q{background:var(--barq)}
.vbar u{display:block;font-size:10px;color:var(--mut);text-align:center;text-decoration:none;line-height:1}
.vbar em{font-size:10px;font-style:normal;color:var(--t);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.vstack{display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.vstack i{border-radius:0}
.vstack i:last-child{border-radius:4px 4px 0 0}

.hbar{display:grid;grid-template-columns:minmax(0,7.4em) 1fr auto;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{background:var(--chip);border-radius:5px;height:10px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--bar);min-width:3px}
.hbar .vl{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:40;background:#0b1220;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;
     pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 4px 16px rgba(2,6,23,.3)}
#tip.on{opacity:.96}
.hero{background:linear-gradient(140deg,#16a34a,#0d9488);color:#fff;border:0;text-align:center;padding:22px 16px}
.hero .flame{font-size:40px;line-height:1}
.hero .big{font-size:38px;margin-top:2px}
.hero .sub,.hero h2{color:rgba(255,255,255,.88)}
.hero .bar{background:rgba(255,255,255,.28);margin:14px 0 6px}
.hero .bar i{background:#fff}
.nudge{display:flex;gap:12px;align-items:center;background:var(--chip);border:1px solid var(--line)}
.nudge .ic{font-size:26px;flex:0 0 auto}
.nudge .tx{flex:1;min-width:0}
.nudge b{display:block;font-size:15px}
.day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 6px 2px}
.day:first-child{margin-top:0}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.post .who{display:flex;align-items:center;gap:9px}
.post .av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.post .act{font-size:16px;margin-top:9px}
.plan{border:1px dashed var(--acc);background:var(--card)}
.plan .when{font-weight:700}
.who-pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.who-pick button{flex:0 0 auto;width:auto;padding:7px 12px;font-size:14px;background:var(--chip);color:var(--fg);font-weight:600;margin:0}
.who-pick button.on{background:var(--acc);color:#fff}
nav a{flex:1;text-align:center;padding:11px 0 13px;color:var(--mut);text-decoration:none;font-size:9.5px;font-weight:600}
#backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:29}
#backdrop.on{opacity:1;pointer-events:auto}
#install,.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(2,6,23,.25);transform:translateY(115%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#install.on,.sheet.on{transform:none}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet p,.sheet li{font-size:14px;line-height:1.55;color:var(--mut);margin:7px 0}
.sheet b{color:var(--t)}
.sheet ul{margin:8px 0;padding-left:18px}
button.i{width:22px;height:22px;padding:0;border-radius:50%;background:var(--chip);color:var(--mut);font-size:12px;font-weight:700;line-height:22px;flex:0 0 auto;margin:0 0 0 6px;vertical-align:-4px}
.hero button.i{background:rgba(255,255,255,.25);color:#fff}
#install .head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#install img{width:52px;height:52px;border-radius:14px;flex:0 0 auto}
#install h3{margin:0;font-size:17px}
#install p{margin:2px 0 0;font-size:13px;color:var(--mut)}
#install ol{margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
#install .arrow{text-align:center;font-size:26px;color:var(--acc);margin-top:10px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#0b1220;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
</style>
</head>
<body>
<main id="app"><div class="card">Lade…</div></main>
<nav>
  <a href="#home"><b>🔥</b>Start</a>
  <a href="#feed"><b>📣</b>Feed</a>
  <a href="#add"><b>➕</b>Eintrag</a>
  <a href="#stats"><b>📊</b>Zahlen</a>
  <a href="#set"><b>⚙️</b>Mehr</a>
</nav>
<div class="toast" id="toast"></div>
<div id="tip"></div>
<div id="backdrop" onclick="laterInstall(false);hideInfo()"></div>
<div id="install" role="dialog" aria-modal="true" aria-labelledby="installTitle"></div>
<div id="info" class="sheet" role="dialog" aria-modal="true"></div>
<script>
/* ---------- Basis ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const weekOf = s => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
const addW = (w, n) => { const d = new Date(w + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 7 * n); return d.toISOString().slice(0, 10); };
const dm = s => s.slice(8) + "." + s.slice(5, 7) + ".";
const daysLeft = () => 7 - ((new Date().getDay() + 6) % 7);
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const relDay = iso => {
  const d = new Date(iso + "T12:00:00"), t = new Date(todayISO() + "T12:00:00");
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return "Heute";
  if (diff === 1) return "Gestern";
  if (diff === 2) return "Vorgestern";
  if (diff > 0 && diff < 7) return WD[d.getDay()];
  return WD[d.getDay()].slice(0, 2) + ", " + dm(iso) + (d.getFullYear() !== t.getFullYear() ? d.getFullYear() : "");
};
const money = (n, c) => (Math.round(n * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + c;

/* ---------- Installation ---------- */
let installEvent = null;
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isSafari = () => /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|chrome/i.test(navigator.userAgent);

addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; if (load.offered) showInstall(); });
addEventListener("appinstalled", () => { hideInstall(); toast("Installiert. 🎉"); });

function showInstall(force) {
  if (installed() || pinResolve || !D) return;
  if (!force) {
    const later = +localStorage.installLater || 0;
    if (Date.now() - later < 7 * 864e5) return;      // nach „Später" eine Woche Ruhe
    if (!installEvent && !isIos()) return;            // Browser ohne Dialog nicht belästigen
  }
  const box = document.getElementById("install");
  const head = `<div class="head"><img src="/icon-192.png?v=__V__" alt="">
    <div><h3 id="installTitle">Das Programm installieren</h3>
    <p>Als App auf dem Home-Bildschirm – mit Benachrichtigungen.</p></div></div>`;

  if (installEvent) {
    box.innerHTML = head +
      `<button onclick="doInstall()">Jetzt installieren</button>
       <button class="ghost" onclick="laterInstall(true)">Später</button>`;
  } else if (isIos()) {
    box.innerHTML = head +
      (isSafari() ? "" : `<p style="color:var(--warn);margin-top:10px">Das geht nur in Safari. Öffne diese Seite dort.</p>`) +
      `<ol><li>Unten auf <b>Teilen</b> tippen <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></li>
        <li><b>Zum Home-Bildschirm</b> wählen</li>
        <li>Rechts oben auf <b>Hinzufügen</b></li></ol>
       <div class="arrow">⬇︎</div>
       <button class="ghost" onclick="laterInstall(true)">Verstanden</button>`;
  } else {
    box.innerHTML = head +
      `<p style="margin-top:10px">In deinem Browser geht das über das Menü: <b>Zum Startbildschirm hinzufügen</b> bzw. <b>App installieren</b>.</p>
       <button class="ghost" onclick="laterInstall(true)">Verstanden</button>`;
  }
  box.classList.add("on");
  document.getElementById("backdrop").classList.add("on");
}
// Kurze Erklärungen, dort wo die Frage aufkommt.
const INFOS = {
  guthaben: ["So funktioniert das Guthaben", `
    <p>Wer mehr macht als das Wochenziel, sammelt Guthaben:</p>
    <ul><li>die <b>dritte</b> Einheit einer Woche bringt <b>1</b></li>
        <li>die <b>vierte</b> noch <b>0,5</b></li>
        <li>die <b>fünfte</b> noch <b>0,3</b></li>
        <li>alles darüber bringt nichts mehr</li></ul>
    <p>Mehr als <b>9</b> lassen sich nicht ansparen.</p>
    <p>Fehlt dir später eine Einheit, springen <b>3 Guthaben</b> automatisch ein –
       aber nur, wenn sie zu dem Zeitpunkt schon da waren. Rückwirkend geht nichts.</p>
    <p>Eine ganze Woche lässt sich nie decken: mindestens ein eigener Eintrag muss
       stehen, Sport oder Krankmeldung. Wer eine Woche gar nichts macht, zahlt.</p>
    <p>Ihr könnt die Regel jederzeit wieder ausschalten – dann rechnet die Kasse
       sofort wieder ohne Guthaben, auch für die Wochen davor. Nichts geht kaputt.</p>`],
  anstupser: ["Wann die App sich meldet", `
    <p>Nur wenn du hinterherhinkst, und höchstens einmal je Gelegenheit:</p>
    <ul><li><b>Mitte der Woche</b>, wenn noch gar nichts steht – mal mittwochs, mal donnerstags,
            zwischen 11 und 14 Uhr</li>
        <li><b>zum Wochenende</b>, wenn noch etwas fehlt – freitags oder samstags vormittags</li>
        <li><b>sonntags</b> als letzte Erinnerung, bevor es Geld kostet</li></ul>
    <p>Wann genau, wechselt von Woche zu Woche. Wer sein Ziel hat, hört nichts.</p>
    <p>Der Text richtet sich nach deiner Serie, deinen Sportarten und – wenn du den
       Standort freigibst – nach dem Wetter.</p>`],
};

function showInfo(key) {
  const [title, body] = INFOS[key] || [];
  if (!title) return;
  const box = document.getElementById("info");
  box.innerHTML = `<h3>${title}</h3>${body}<button class="ghost" onclick="hideInfo()">Verstanden</button>`;
  box.classList.add("on");
  document.getElementById("backdrop").classList.add("on");
}
function hideInfo() {
  document.getElementById("info").classList.remove("on");
  document.getElementById("backdrop").classList.remove("on");
}
const infoBtn = key => `<button class="i" title="Erklärung" onclick="showInfo('${key}')">i</button>`;
const fmtCredits = n => (Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".", ","));

function hideInstall() {
  document.getElementById("install").classList.remove("on");
  document.getElementById("backdrop").classList.remove("on");
}
function laterInstall(remember) { if (remember) localStorage.installLater = Date.now(); hideInstall(); }
async function doInstall() {
  if (!installEvent) return hideInstall();
  hideInstall();
  const e = installEvent; installEvent = null;
  e.prompt();
  const { outcome } = await e.userChoice;
  if (outcome !== "accepted") localStorage.installLater = Date.now();
}

let D = null, busy = false;
let pin = localStorage.pin || "";
let me = +localStorage.me || 0;
const device = localStorage.device || (localStorage.device = (crypto.randomUUID ? crypto.randomUUID() : "d" + Date.now() + Math.random().toString(36).slice(2)));

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }

let pinResolve = null;
function askPin(wrong) {
  return new Promise(res => {
    pinResolve = res;
    document.body.classList.add("locked");
    $("#app").innerHTML = `<div class="card" style="margin-top:18vh;text-align:center">
      <div style="font-size:42px;line-height:1">🔒</div>
      <h2 style="text-align:center;margin-top:8px">Gruppen-PIN</h2>
      <div class="sub">${wrong ? '<span class="bad">Die PIN stimmt nicht.</span>'
        : "Einmalig eingeben – dieses Gerät merkt sie sich."}</div>
      <input id="pinIn" type="text" autocapitalize="characters" autocorrect="off" autocomplete="off"
        placeholder="PIN" style="text-align:center;letter-spacing:.35em;font-size:20px;text-transform:uppercase"
        onkeydown="if(event.key==='Enter')submitPin()">
      <button onclick="submitPin()">Weiter</button></div>`;
    setTimeout(() => $("#pinIn")?.focus(), 60);
  });
}
function submitPin() {
  const v = $("#pinIn").value.trim();
  if (!v) return;
  pin = v; localStorage.pin = v;
  document.body.classList.remove("locked");
  const done = pinResolve; pinResolve = null; done();
}

async function api(p, method = "GET", body, _retry = 0) {
  const r = await fetch("/api/" + p, {
    method,
    headers: { "content-type": "application/json", "x-pin": pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    await askPin(_retry > 0);
    return api(p, method, body, _retry + 1);
  }
  if (!r.ok && r.headers.get("content-type")?.includes("json")) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || "Fehler " + r.status);
  }
  if (!r.ok) throw new Error("Fehler " + r.status);
  return r;
}
const get = p => api(p).then(r => r.json());

async function load() {
  try {
    D = await get("state");
    if (me && !D.members.some(m => m.id === me)) { me = 0; localStorage.removeItem("me"); }
    render();
    if (!load.offered) { load.offered = true; setTimeout(() => showInstall(), 1000); refreshLocation(); }
  } catch (e) { $("#app").innerHTML = '<div class="card"><h2>Fehler</h2>' + esc(e.message) + '</div>'; }
}

/* ---------- Auswertung ---------- */
const inWeek = (mid, w) => D.entries.filter(e => e.member_id === mid && weekOf(e.date) === w);
const done = (mid, w) => inWeek(mid, w).filter(e => e.kind !== "sick").length;
const sick = (mid, w) => inWeek(mid, w).filter(e => e.kind === "sick").reduce((a, e) => a + (e.units || 1), 0);
const credit = (mid, w) => done(mid, w) + Math.min(sick(mid, w), D.settings.sickMax ?? D.settings.required);

function weeksOf(member) {
  const s = D.settings;
  const from = weekOf((member.joined && member.joined > s.start) ? member.joined : s.start);
  const cur = weekOf(todayISO());
  const out = [];
  for (let w = from, i = 0; w < cur && i < 520; w = addW(w, 1), i++) out.push(w);
  return out;
}

/* ---------- Start ---------- */
function viewHome() {
  const s = D.settings, c = s.currency, cur = weekOf(todayISO());

  const w4 = [3, 2, 1, 0].map(i => addW(cur, -i));

    <div class="seg" style="flex-wrap:wrap">${D.members.map(m => `<button onclick="pickMe(${m.id})">${esc(m.name)}</button>`).join("")}</div></div>`;

  return whoCard + hero(st) + installNudge() + pushNudge() + `
  <div class="card"><h2>Diese Woche · ab ${dm(cur)} · Ziel ${s.required}</h2><table>

    }).join("")}
  </table><div class="hint">Wer das Ziel verpasst, zahlt ${money(s.fine, c)} in die Kasse.</div></div>

  <div class="card"><h2>Letzte 4 Wochen</h2><table>
    <tr><th></th>${w4.map(w => `<th>${dm(w)}${w === cur ? "*" : ""}</th>`).join("")}</tr>
    ${D.members.map(m => `<tr><td>${esc(m.name)}</td>${w4.map(w => {
      const cr = credit(m.id, w), counts = weeksOf(m).includes(w) || w === cur;
      const cls = !counts ? "sub" : cr >= s.required ? "ok" : w === cur ? "warn" : "bad";
      return `<td class="${cls}">${counts ? done(m.id, w) + (sick(m.id, w) ? "🤒" : "") : "–"}</td>`;
    }).join("")}</tr>`).join("")}
  </table><div class="hint">* laufende Woche</div></div>

  <div class="card"><h2>Rangliste</h2><table>
    <tr><th></th><th>Einheiten</th>${s.bonus ? "<th>Guthaben</th>" : ""}<th>Verpasst</th><th>Eingezahlt</th></tr>
    ${board.map((m, i) => `<tr><td>${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(m.name)}</td>
      <td>${st[m.id].sessions}</td>${s.bonus ? `<td>✨ ${fmtCredits(st[m.id].credits)}</td>` : ""}
      <td>${st[m.id].missed}/${st[m.id].weeks}${st[m.id].saved ? ` <span class="ok" title="mit Guthaben gerettet">+${st[m.id].saved}✨</span>` : ""}</td>
      <td>${money(st[m.id].paid, c)}</td></tr>`).join("")}
  </table>${s.bonus ? `<div class="hint">Jede Einheit über dem Ziel gibt ein Guthaben. ${s.bonusCost} Guthaben decken

  </div>`;
}

// Oben steht, was antreibt: die eigene Serie und was diese Woche noch fehlt.
function hero(st) {
  const s = D.settings, cur = weekOf(todayISO());
  if (!me) return "";
  const mine = st[me];
  if (!mine) return "";
  const cr = mine.week.credit, left = mine.week.left, days = daysLeft();
  const pct = Math.min(100, s.required ? cr / s.required * 100 : 100);
  const headline = mine.streak
    ? `<div class="flame">🔥</div><div class="big">${mine.streak} ${mine.streak === 1 ? "Woche" : "Wochen"}</div><div class="sub">am Stück geschafft</div>`
    : `<div class="flame">💪</div><div class="big">Los geht's</div><div class="sub">Diese Woche startet deine Serie</div>`;
  const line = left === 0
    ? `Diese Woche erledigt · ${cr} ${cr === 1 ? "Einheit" : "Einheiten"}`
      + (mine.streak > 1 ? " · Serie hält" : "")
    : `Noch ${left} ${left === 1 ? "Einheit" : "Einheiten"} in ${days} ${days === 1 ? "Tag" : "Tagen"}`
      + ` · ${cr} von ${s.required}`;
  const bonus = s.bonus
    ? `<div class="sub" style="margin-top:10px;border-top:1px solid rgba(255,255,255,.25);padding-top:8px">
        ✨ <b>${fmtCredits(mine.credits)}</b> von ${mine.maxCredits || 9} Guthaben${
          mine.pending ? " (+" + fmtCredits(mine.pending) + " diese Woche)" : ""}
        ${mine.week.canRescue ? ` · ${mine.rescueCost} davon decken die Woche` : ""}${infoBtn("guthaben")}</div>`
    : "";
  return `<div class="card hero">${headline}
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub">${line}</div>${bonus}</div>`;
}

// Steht da, solange die App im Browser statt vom Home-Bildschirm läuft.
function installNudge() {
  if (installed() || !("serviceWorker" in navigator)) return "";
  return `<div class="card nudge"><div class="ic">\u{1F4F2}</div><div class="tx"><b>Auf den Home-Bildschirm</b>
    <div class="sub">Als App geöffnet startet sie schneller – und nur so kommen auf dem iPhone Benachrichtigungen an.</div></div>
    <button class="s" onclick="showInstall(true)">Installieren</button></div>`;
}

// Bleibt stehen, bis Push auf diesem Gerät läuft.
function pushNudge() {
  if (localStorage.pushOn === "1") return "";
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "";
  if (!D.vapidPublicKey) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (Notification.permission === "denied")
    return `<div class="card nudge"><div class="ic">🔕</div><div class="tx"><b>Benachrichtigungen blockiert</b>
      <div class="sub">In den Einstellungen deines Browsers für diese Seite wieder erlauben.</div></div></div>`;
  if (ios && !standalone)
    return `<div class="card nudge"><div class="ic">🔔</div><div class="tx"><b>Benachrichtigungen</b>
      <div class="sub">Dafür die App erst zum Home-Bildschirm hinzufügen.</div></div>
      <button class="s" onclick="showInstall(true)">Wie?</button></div>`;
  return `<div class="card nudge"><div class="ic">🔔</div><div class="tx"><b>Benachrichtigungen einschalten</b>
    <div class="sub">Sonst verpasst du, wenn jemand eine Einheit einträgt.</div></div>
    <button class="s" onclick="togglePush()">Einschalten</button></div>`;
}

const nf = n => Number(n).toLocaleString("de-DE");
const hours = h => (h >= 10 ? Math.round(h) : Math.round(h * 10) / 10).toLocaleString("de-DE");
const seriesColor = i => "var(--s" + ((i % 8) + 1) + ")";

// Säulen: eine Reihe, Zahl über der Säule, gestrichelte Ziellinie.
// items: [{ label, value, tip }]
function colBars(items, goal) {
  const max = Math.max(goal, ...items.map(x => x.value), 1);
  const line = goal ? `<div class="goal" style="bottom:${(goal / max) * 100}%"><em>Ziel ${goal}</em></div>` : "";
  return `<div class="vbars">${line}${items.map(x => {
    const met = goal ? x.value >= goal : x.value > 0;
    return `<div class="vbar" data-tip="${esc(x.tip)}">
      <em>${x.value || ""}</em>
      <i class="${met ? "" : "q"}" style="height:${(x.value / max) * 100}%"></i>
      <u>${esc(x.label)}</u></div>`;
  }).join("")}</div>`;
}

const asWeeks = weeks => weeks.map(w => ({
  label: w.week.slice(8) + ".",
  value: w.units,
  tip: "Woche ab " + dm(w.week) + " · " + w.units + " " + (w.units === 1 ? "Einheit" : "Einheiten"),
}));

// Gestapelte Säulen: ein Segment je Person, 2 px Fuge dazwischen.
function stackBars(stacked, people, goal) {
  const totals = stacked.map(w => Object.values(w.byMember).reduce((a, b) => a + b, 0));
  const max = Math.max(goal, ...totals, 1);
  const line = goal ? `<div class="goal" style="bottom:${(goal / max) * 100}%"><em>Ziel ${goal}</em></div>` : "";
  return `<div class="vbars">${line}${stacked.map((w, wi) => {
    const parts = people.map((p, i) => ({ p, i, n: w.byMember[p.id] || 0 })).filter(x => x.n);
    const names = parts.map(x => x.p.name + ": " + x.n).join(" · ");
    return `<div class="vbar" data-tip="Woche ab ${esc(dm(w.week))} · ${totals[wi]} gesamt${names ? " · " + esc(names) : ""}">
      <em>${totals[wi] || ""}</em>
      <div class="vstack" style="height:${(totals[wi] / max) * 100}%">
        ${parts.map(x => `<i style="height:${(x.n / totals[wi]) * 100}%;background:${seriesColor(x.i)}"></i>`).join("")}
      </div>
      <u>${w.week.slice(8)}.</u></div>`;
  }).join("")}</div>`;
}

// Balken: Name links, Zahl rechts - Farbe trägt nie allein die Bedeutung.
function rowBars(rows) {
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map(r => `<div class="hbar" data-tip="${esc(r.tip || r.label + ": " + r.value)}">
    <span class="nm">${esc(r.label)}</span>
    <div class="tr"><i style="width:${Math.max(3, (r.value / max) * 100)}%${r.color ? ";background:" + r.color : ""}"></i></div>
    <span class="vl">${esc(r.right)}</span></div>`).join("");
}

    <div class="hint">Die letzten ${d.weeks.length} Wochen. Graue Säulen haben das Ziel verfehlt.</div></div>`;

    ${rowBars(d.sports.map(sp => ({
      label: sportIcon(sp.sport) + " " + sp.sport,
      value: sp.count,
      right: sp.count + "×" + (sp.secs > 60 ? " · " + hours(sp.secs / 3600) + " h" : ""),
      tip: sp.sport + ": " + sp.count + " Einheiten"
        + (sp.secs > 60 ? ", " + hours(sp.secs / 3600) + " Stunden" : "")
        + (sp.km > 0.5 ? ", " + nf(Math.round(sp.km)) + " km" : ""),
    })))}
    ${d.moreSports ? `<div class="hint">und ${d.moreSports} weitere</div>` : ""}</div>` : "";

  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const WDL = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
  const bestDay = d.weekdays.indexOf(Math.max(...d.weekdays));
  const tage = d.sessions ? `<div class="card"><h2>Lieblingstage</h2>
    ${colBars(d.weekdays.map((n, i) => ({
      label: WD[i], value: n,

    })), 0)}

  const leute = !mine && people.length ? `<div class="card"><h2>Wer wie viel</h2>

      tip: p.name + ": " + p.sessions + " Einheiten" + (p.hours ? ", " + hours(p.hours) + " Stunden" : "")
        + (p.km ? ", " + nf(Math.round(p.km)) + " km" : ""),

    ${R.team.together ? `<div class="hint">${R.team.together} Einheiten habt ihr zusammen gemacht.</div>` : ""}</div>` : "";

  const tabelle = `<div class="card"><h2>Als Tabelle</h2><table>
    <tr><th>Sportart</th><th>Einheiten</th><th>Stunden</th><th>km</th></tr>
    ${d.sports.map(sp => `<tr><td>${esc(sp.sport)}</td><td>${sp.count}</td>
      <td>${sp.secs > 60 ? hours(sp.secs / 3600) : "–"}</td>
      <td>${sp.km > 0.5 ? nf(Math.round(sp.km)) : "–"}</td></tr>`).join("")}
  </table></div>`;

  return toggle + noMe + (statsWho === "me" && !me ? "" : tiles + verlauf + sportarten + tage + leute + tabelle);
}

/* ---------- Feed ---------- */
let filterOpen = false, feedFilter = { member: 0, sport: "" };

const setFilter = (key, value) => { feedFilter[key] = value; render(); };
const clearFilter = () => { feedFilter = { member: 0, sport: "" }; filterOpen = false; render(); };
const filterActive = () => !!(feedFilter.member || feedFilter.sport);

// Die Leiste bleibt eine schmale Zeile, bis jemand sie aufklappt.
function filterBar(sportsInFeed) {
  if (!filterOpen && !filterActive())
    return `<div style="text-align:right;margin:-4px 0 10px">
      <button class="s" style="background:transparent;border:0;color:var(--mut);padding:4px 2px"
        onclick="filterOpen=true;render()">⌕ Filtern</button></div>`;

  const mine = feedFilter.member;
  return `<div class="card" style="padding:12px 14px">
    <div class="flex"><b style="font-size:14px">Feed filtern</b>
      <button class="x" onclick="clearFilter()" title="Filter aufheben">✕</button></div>
    <div class="row">
      <select onchange="setFilter('member', +this.value)">
        <option value="0">alle Personen</option>
        ${D.members.map(m => `<option value="${m.id}"${m.id === mine ? " selected" : ""}>${esc(m.name)}</option>`).join("")}
      </select>
      <select onchange="setFilter('sport', this.value)">
        <option value="">alle Sportarten</option>
        ${sportsInFeed.map(sp => `<option value="${esc(sp)}"${sp === feedFilter.sport ? " selected" : ""}>${esc(sp)}</option>`).join("")}
      </select>
    </div></div>`;
}

function viewFeed() {
  if (!D.members.length) return onboarding();
  const nameOf = id => D.members.find(m => m.id === id)?.name || "?";
  if (!D.entries.length && !(D.plans || []).length && !(D.events || []).length && !filterActive())
    return planCards() + `<div class="card"><h2>Feed</h2><div class="sub">Noch nichts passiert. Mach den Anfang.</div>
      <button onclick="location.hash='#add'">Einheit eintragen</button></div>`;

  // Eintraege einer gemeinsamen Einheit zu einem Beitrag zusammenfassen
  const merged = [];
  const seen = new Map();
  for (const e of D.entries) {                 // absteigend nach id: die eintragende Person kommt zuletzt
    const known = e.group_id && seen.get(e.group_id);
    if (known) {
      known.crew.unshift(e.member_id);
      if (e.hasPhoto) { known.hasPhoto = 1; known.photoId = e.id; }  // Foto haengt am Eintrag des Eintragenden
      continue;
    }
    const post = { ...e, crew: [e.member_id], photoId: e.id };
    if (e.group_id) seen.set(e.group_id, post);
    merged.push(post);
  }

  const sportsInFeed = [...new Set(D.entries.map(e => e.sport).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
  const passt = (e) => {
    if (feedFilter.member && !(e.isEvent ? e.member_id === feedFilter.member : e.crew.includes(feedFilter.member))) return false;
    if (feedFilter.sport && (e.isEvent || e.sport !== feedFilter.sport)) return false;
    return true;
  };

  const all = [...merged, ...(D.events || [])
      .filter(ev => D.members.some(m => m.id === ev.member_id))   // Teilnehmer gelöscht
      .map(ev => ({ ...ev, isEvent: true }))]
    .filter(passt)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id || 0) - (a.id || 0)));

  const days = [];
  for (const e of all) {
    if (!days.length || days[days.length - 1].date !== e.date) days.push({ date: e.date, items: [] });
    days[days.length - 1].items.push(e);
  }
  const leer = !all.length
    ? `<div class="card"><h2>Nichts gefunden</h2><div class="sub">Mit diesem Filter steht hier nichts.</div>
       <button class="ghost" onclick="clearFilter()">Filter aufheben</button></div>` : "";

  return planCards() + filterBar(sportsInFeed) + leer + days.map(d => `<div class="day">${relDay(d.date)}</div>` + d.items.map(e => {
    if (e.isEvent) {
      const who = D.members.find(m => m.id === e.member_id);
      return `<div class="post plan"><div class="act">✨ <b>Guthaben</b> <span class="sub">für ${esc(who.name)}</span></div>
        <div class="sub" style="margin-top:3px">${esc(e.text)}</div></div>`;
    }
    const names = e.crew.map(nameOf);
    const n = names.length > 1 ? names.slice(0, -1).join(", ") + " & " + names[names.length - 1] : names[0];
    const meta = e.meta ? Object.entries(JSON.parse(e.meta)) : [];
    return `<div class="post">
      <div class="who"><div class="av">${names.length > 1 ? names.length : esc(names[0].slice(0, 1).toUpperCase())}</div>
        <div style="flex:1"><b>${esc(n)}</b>${e.crew.includes(me) ? ' <span class="chip">du</span>' : ""}
          ${names.length > 1 ? '<div class="sub">zusammen unterwegs</div>' : ""}</div>
        <button class="x" onclick="editEntry(${e.id})" title="Ändern">✎</button>
        <button class="x" onclick="delEntry(${e.id})" title="Löschen">✕</button></div>
      <div class="act">${e.kind === "sick"
        ? "🤒 Krankmeldung (" + (e.units || 1) + " " + ((e.units || 1) === 1 ? "Einheit" : "Einheiten") + ")"

/* --- GPX / TCX --- */
const els = (root, name) => [...root.getElementsByTagNameNS("*", name)];
const txt = (root, name) => els(root, name)[0]?.textContent?.trim() || "";
const num = (root, name) => parseFloat(txt(root, name).replace(",", ".")) || 0;
const fmtDur = sec => sec >= 3600 ? Math.floor(sec / 3600) + ":" + pad(Math.round(sec % 3600 / 60)) + " h" : Math.round(sec / 60) + " min";
const fmtPace = (sec, km) => { const t = Math.round(sec / km); return Math.floor(t / 60) + ":" + pad(t % 60) + " /km"; };
const fmtPace100 = (sec, km) => { const t = Math.round(sec / (km * 10)); return Math.floor(t / 60) + ":" + pad(t % 60) + " /100 m"; };
const fmtKmh = (sec, km) => (km / (sec / 3600)).toFixed(1).replace(".", ",") + " km/h";

// Bei was man rollt oder gleitet, sagt km/h mehr als Minuten pro Kilometer.
const AS_KMH = new Set(["Radfahren", "Rennrad", "Mountainbike", "Gravelbike", "E-Bike",
  "Indoor-Cycling", "Spinning", "Skifahren", "Snowboard", "Langlauf", "Skitour", "Rodeln",
  "Inlineskaten", "Skateboard", "Eislaufen", "Reiten", "Segeln", "Kajak", "Kanu",
  "Stand-up-Paddling", "Surfen", "Kitesurfen", "Rudern", "Ruderergometer"]);
// Im Wasser rechnet man je 100 Meter.
const AS_100M = new Set(["Schwimmen", "Freiwasserschwimmen"]);

function speedOf(sec, km, sport) {
  if (!(km > 0.3 && sec > 60)) return null;
  if (AS_100M.has(sport)) return ["Tempo", fmtPace100(sec, km)];
  if (AS_KMH.has(sport)) return ["Schnitt", fmtKmh(sec, km)];
  if (!sport) return km / (sec / 3600) >= 12 ? ["Schnitt", fmtKmh(sec, km)] : ["Tempo", fmtPace(sec, km)];
  return ["Tempo", fmtPace(sec, km)];
}

// Anstieg mit Schwelle, damit GPS-Rauschen keine Berge erfindet.
function climbOf(elevations) {
  const e = elevations.filter(x => Number.isFinite(x));
  if (e.length < 3) return 0;
  let gain = 0, ref = e[0];
  for (const v of e) {
    if (v > ref + 3) { gain += v - ref; ref = v; }
    else if (v < ref) ref = v;
  }
  return Math.round(gain);
}

function haversine(a1, o1, a2, o2) {
  const R = Math.PI / 180;
  const h = Math.sin((a2 - a1) * R / 2) ** 2 + Math.cos(a1 * R) * Math.cos(a2 * R) * Math.sin((o2 - o1) * R / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
}
function fromPoints(points, latAttr) {
  let km = 0;
  const co = points.map(latAttr);
  for (let i = 1; i < co.length; i++) if (co[i] && co[i - 1]) km += haversine(co[i - 1][0], co[i - 1][1], co[i][0], co[i][1]);
  return km;
}
// Aus den rohen Werten wird die Anzeige - abhaengig davon, welche Sportart
// gerade im Feld steht. Wechselt sie, rechnet buildMeta neu.
function buildMeta(raw, sport) {
  if (!raw) return null;
  const { km = 0, sec = 0, climb = 0, hr = 0, kcal = 0 } = raw;
  const out = {};
  if (km > 0.05) out.Distanz = km.toFixed(2).replace(".", ",") + " km";
  if (sec > 30) out.Dauer = fmtDur(sec);
  const sp = speedOf(sec, km, sport);
  if (sp) out[sp[0]] = sp[1];
  if (climb >= 20) out["Anstieg"] = climb + " hm";
  if (hr) out.Puls = Math.round(hr) + " bpm";
  if (kcal) out.kcal = String(Math.round(kcal));
  return Object.keys(out).length ? out : null;
}
function parseGpx(xml) {
  const pts = els(xml, "trkpt").concat(els(xml, "rtept"));
  const km = fromPoints(pts, p => [+p.getAttribute("lat"), +p.getAttribute("lon")]);
  const times = pts.map(p => Date.parse(txt(p, "time"))).filter(t => !isNaN(t));
  const sec = times.length > 1 ? (Math.max(...times) - Math.min(...times)) / 1000 : 0;
  const climb = climbOf(pts.map(p => num(p, "ele")));
  const type = txt(xml, "type") || (els(xml, "trk")[0] && txt(els(xml, "trk")[0], "type"));
  return { km, sec, climb, sport: type && type.length < 20 ? type : "" };
}
function parseTcx(xml) {
  const laps = els(xml, "Lap");
  let sec = 0, km = 0, kcal = 0, hr = [], dist = 0;
  for (const l of laps) {
    sec += num(l, "TotalTimeSeconds");
    dist += num(l, "DistanceMeters");
    kcal += num(l, "Calories");
    const h = els(l, "AverageHeartRateBpm")[0];
    if (h) { const v = num(h, "Value"); if (v) hr.push(v); }
  }
  km = dist / 1000;
  const pts = els(xml, "Trackpoint");
  if (km < 0.05) km = fromPoints(pts, p => { const pos = els(p, "Position")[0]; return pos ? [num(pos, "LatitudeDegrees"), num(pos, "LongitudeDegrees")] : null; });
  if (sec < 30) {
    const times = pts.map(p => Date.parse(txt(p, "Time"))).filter(t => !isNaN(t));
    if (times.length > 1) sec = (Math.max(...times) - Math.min(...times)) / 1000;
  }
  const climb = climbOf(pts.map(p => num(p, "AltitudeMeters")));
  const sport = els(xml, "Activity")[0]?.getAttribute("Sport") || "";
  return {
    km, sec, climb, kcal,
    hr: hr.length ? hr.reduce((a, b) => a + b, 0) / hr.length : 0,
    sport: sport && sport !== "Other" ? sport : "",
  };
}

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Bild konnte nicht gelesen werden.")); i.src = url; });
    const k = Math.min(1, 1100 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    let q = 0.68, out = cv.toDataURL("image/jpeg", q);
    while (out.length > 650000 && q > 0.3) { q -= 0.12; out = cv.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

async function preview() {
  pending = null;
  const f = $("#file").files[0];
  const box = $("#prev");
  if (!f) { box.textContent = ""; return; }
  box.textContent = "Lese Datei…";
  try {
    const low = f.name.toLowerCase();
    if (low.endsWith(".gpx") || low.endsWith(".tcx")) {
      const xml = new DOMParser().parseFromString(await f.text(), "application/xml");
      if (els(xml, "parsererror").length || xml.querySelector("parsererror")) throw new Error("Datei nicht lesbar.");
      const raw = low.endsWith(".gpx") ? parseGpx(xml) : parseTcx(xml);
      if (raw.sport) { const field = $("#sport"); if (field) field.value = normSport(raw.sport); }
      const meta = buildMeta(raw, normSport($("#sport")?.value));
      if (!meta) throw new Error("Keine Aktivitätsdaten gefunden.");
      pending = { meta, raw };
      showChips(meta);
    } else if (f.type.startsWith("image/")) {
      const photo = await shrink(f);
      pending = { photo };
      box.innerHTML = `<img class="ph" src="${photo}" alt="">`;
    } else throw new Error("Nur Bilder, GPX oder TCX.");
  } catch (e) { box.innerHTML = '<span class="bad">' + esc(e.message) + "</span>"; }
}

    if (!me) { me = body.member_id; localStorage.me = me; }
    pending = null;
    toast(kind === "sick" ? "Krankmeldung gespeichert." : "Einheit gespeichert. 💪");
    if (location.hash === "#add" || location.hash === "") location.hash = "#home";
    await load();
  } catch (e) { toast(e.message); }
  finally {
    busy = false;
    const b = $("#saveBtn");
    if (b) { b.disabled = false; b.textContent = "Speichern"; }
  }
}

/* ---------- Einstellungen ---------- */
function viewSet() {
  const s = D.settings;
  const pushState = localStorage.pushOn === "1";
  const canPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);

  return `<div class="card"><h2>Regeln</h2>
    <label>Einheiten pro Woche</label><input id="req" type="number" min="1" max="21" value="${s.required}">
    <label>Strafe pro verpasster Woche</label><input id="fine" type="number" min="0" step="0.5" value="${s.fine}">
    <label>Währung</label><input id="cur" value="${esc(s.currency)}">
    <label>Krankmeldung ersetzt höchstens … Einheiten pro Woche</label><input id="sickMax" type="number" min="0" max="21" value="${s.sickMax ?? s.required}">
    <label>Start der Challenge</label><input id="start" type="date" value="${esc(s.start)}">
    <button onclick="saveSettings()">Regeln speichern</button></div>

  <div class="card"><h2>Benachrichtigungen</h2>
    ${!canPush ? '<div class="sub">Dieser Browser unterstützt keine Push-Benachrichtigungen.</div>'
      : !D.vapidPublicKey ? '<div class="sub">Auf dem Server sind keine VAPID-Keys hinterlegt.</div>'
      : `<div class="flex"><div><b>Push auf diesem Gerät</b><div class="sub">${pushState ? "aktiv" : "aus"}</div></div>
         <button class="s" onclick="togglePush()">${pushState ? "Ausschalten" : "Einschalten"}</button></div>
         ${pushState ? '<button class="ghost" onclick="testPush()">Testbenachrichtigung senden</button>' : ""}
         ${ios && !standalone ? '<div class="hint">iPhone/iPad: Die App muss erst über „Teilen → Zum Home-Bildschirm" installiert und von dort geöffnet werden, sonst erlaubt iOS kein Push.</div>' : ""}
         <div class="hint">Du bekommst eine Nachricht, wenn jemand anderes einen Eintrag macht – nicht für deine eigenen Einträge von diesem Gerät.</div>`}
  </div>

  <div class="card"><h2>Automatisch eintragen</h2>
    ${!me ? '<div class="sub">Wähle oben erst aus, wer du bist.</div>' : (() => {
      const link = (D.links || []).find(l => l.member_id === me);
      if (link) return `<div class="flex"><div><b>Verbunden${link.name ? " als " + esc(link.name) : ""}</b>
        <div class="sub">${link.last_check ? "zuletzt nachgesehen: " + new Date(link.last_check).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "noch nicht nachgesehen"}</div></div>
        <button class="x" onclick="unlinkIcu()">✕</button></div>
        <button class="ghost" onclick="syncIcu()">Jetzt nachsehen</button>
        <div id="syncInfo" class="sub"></div>
        <div class="hint">Jede neue Einheit ab 20 Minuten wird stündlich abgeholt und hier eingetragen – du musst nichts mehr tun.</div>`;
      return `<div class="sub">Deine Einheiten aus Strava, Garmin, Wahoo &amp; Co. können sich von selbst eintragen.
        Dafür brauchst du ein kostenloses Konto bei <b>intervals.icu</b>, das deine Einheiten ohnehin schon einsammelt.</div>
        <ol style="font-size:14px;line-height:1.7;padding-left:20px">
          <li>Auf <b>intervals.icu</b> anmelden und deinen Sportdienst dort verbinden</li>
          <li>Dort auf <b>Settings</b> gehen</li>
          <li>Ganz unten unter <b>Developer Settings</b> stehen <b>Athlete ID</b> und <b>API Key</b></li>
        </ol>
        <label>Athlete ID</label><input id="icuId" placeholder="i123456" autocomplete="off">
        <label>API Key</label><input id="icuKey" type="password" placeholder="wird nur hier gespeichert" autocomplete="off">
        <button onclick="linkIcu()">Verbinden</button>
        <div class="hint">Der Schlüssel liegt nur in der Datenbank dieser App und wird nie angezeigt.
          Zum Lösen genügt ein Tipp aufs ✕.</div>`;
    })()}
  </div>

  <div class="card"><h2>Motivation</h2>
    <div class="flex"><div><b>Anstupser bei Rückstand${infoBtn("anstupser")}</b>
      <div class="sub">${s.nudges ? "aktiv" : "aus"}</div></div>
      <button class="s" onclick="toggleNudges()">${s.nudges ? "Ausschalten" : "Einschalten"}</button></div>
    ${s.nudges ? `
      <div class="flex" style="margin-top:12px"><div><b>Wetterhinweis</b>
        <div class="sub">${me && D.members.find(m => m.id === me)?.hasGeo
          ? "dein Standort" : "angenommen: " + esc(s.place)}</div></div>
        <button class="s" onclick="useLocation()">Standort verwenden</button></div>
      <div class="hint">Ohne Freigabe rechnet die App mit ${esc(s.place)}. Gibst du den Standort frei,
        stimmt der Hinweis auch unterwegs – einmal reicht, grob genügt völlig. Regnet es, schlägt sie
        etwas drinnen vor, und zwar das, was du ohnehin machst.</div>
      <button class="ghost" onclick="previewNudge()">Beispielnachricht ansehen</button>
      <div id="nudgePreview" class="sub"></div>` : ""}
  </div>

  <div class="card"><h2>Dieses Gerät gehört zu</h2>
    <select onchange="pickMe(+this.value)">
      <option value="0"${!me ? " selected" : ""}>– bitte wählen –</option>
      ${D.members.map(m => `<option value="${m.id}"${m.id === me ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
    <div class="hint">Damit ist der Eintrag immer schon richtig vorbelegt. Kein Profil, kein Login.</div></div>

  <div class="card"><h2>Teilnehmer</h2>
    ${D.members.map(m => `<div class="row">
      <input value="${esc(m.name)}" onchange="renameMember(${m.id}, this.value)">
      <input type="date" value="${esc(m.joined || s.start)}" title="dabei seit" onchange="rejoinMember(${m.id}, this.value)">
      <button class="x" onclick="delMember(${m.id})">✕</button></div>`).join("")}
    <div class="row"><input id="nm" placeholder="Neuer Teilnehmer"><button class="s" onclick="addMember()">Hinzufügen</button></div>
    <div class="hint">Das zweite Feld ist der Tag, ab dem gezählt wird – wer später dazukommt, zahlt nicht rückwirkend.</div></div>

  <div class="card"><h2>Kasse</h2>
    <label>Ausgabe buchen (z. B. Grillen)</label>
    <div class="row"><input id="et" placeholder="Titel"><input id="ea" type="number" step="0.01" placeholder="Betrag"></div>
    <button onclick="addExpense()">Buchen</button>
    ${D.expenses.map(x => `<div class="item flex"><div>${dm(x.date)} · ${esc(x.title)} · <b>${money(x.amount, s.currency)}</b></div>
      <button class="x" onclick="delExpense(${x.id})">✕</button></div>`).join("")}</div>

  <div class="card"><h2>Guthaben${infoBtn("guthaben")}</h2>
    <div class="flex"><div><b>Einheiten über dem Ziel sammeln</b>
      <div class="sub">${s.bonus ? "aktiv" : "aus"}</div></div>
      <button class="s" onclick="toggleBonus()">${s.bonus ? "Ausschalten" : "Einschalten"}</button></div>
    ${s.bonus ? `<label>Wie viele Guthaben decken eine fehlende Einheit?</label>
      <div class="row"><input id="bonusCost" type="number" min="1" max="20" value="${s.bonusCost}">
        <button class="s" onclick="saveBonusCost()">Merken</button></div>` : ""}
    <div class="hint">Die dritte Einheit einer Woche bringt 1 Guthaben, die vierte 0,5, die fünfte 0,3 –
      höchstens 9 insgesamt. Fehlt später eine Einheit, springen ${s.bonusCost} davon ein, aber nie
      rückwirkend und nie für eine ganze Woche. Das Kleingedruckte steht hinter dem i.
      ${s.bonus ? "Schaltest du die Regel wieder aus, rechnet die Kasse sofort wieder streng – und das Guthaben beginnt bei null, falls ihr es später erneut einschaltet."
        : "Gesammelt wird ab dem Tag, an dem ihr sie einschaltet."}</div>
  </div>

  <div class="card"><h2>App</h2>
    <div class="flex"><div><b>Auf dem Home-Bildschirm</b><div class="sub">${installed() ? "installiert" : "noch nicht installiert"}</div></div>
      ${installed() ? "" : '<button class="s" onclick="showInstall(true)">Installieren</button>'}</div>
    <div class="sub" style="margin-top:10px">Gerät: ${esc(device.slice(0, 8))}</div>
    <button class="ghost" onclick="location.reload()">Neu laden</button></div>`;
}

const saveSettings = guard(async () => {
  await api("settings", "POST", {
    required: +$("#req").value, fine: +$("#fine").value, currency: $("#cur").value,
    sickMax: +$("#sickMax").value, start: $("#start").value,
  });
  toast("Gespeichert."); await load();
});
const linkIcu = guard(async () => {
  const athlete_id = $("#icuId").value.trim(), api_key = $("#icuKey").value.trim();
  if (!athlete_id || !api_key) return toast("Beide Felder ausfüllen.");
  toast("Prüfe …");
  const r = await (await api("link", "POST", { member_id: me, athlete_id, api_key })).json();
  toast(r.imported?.length ? r.imported.length + " Einheiten übernommen." : "Verbunden.");
  await load();
});
const unlinkIcu = guard(async () => {
  if (!confirm("Verbindung lösen? Bereits übernommene Einheiten bleiben stehen.")) return;
  await api("link/remove", "POST", { member_id: me });
  await load();
});
const syncIcu = guard(async () => {
  const box = $("#syncInfo");
  if (box) box.textContent = "Sehe nach …";
  const r = await (await api("link/sync", "POST", { member_id: me })).json();
  if (box) box.textContent = r.imported.length
    ? r.imported.length + " neue Einheit(en) übernommen."
    : "Nichts Neues.";
  if (r.imported.length) await load();
});

const toggleBonus = guard(async () => {
  await api("settings", "POST", { bonus: !D.settings.bonus });
  await load();
});
const saveBonusCost = guard(async () => {
  await api("settings", "POST", { bonusCost: +$("#bonusCost").value });
  toast("Gemerkt.");
  await load();
});
const toggleNudges = guard(async () => {
  await api("settings", "POST", { nudges: !D.settings.nudges });
  await load();
});
// Grober Standort fürs Wetter. Einmal freigeben, danach merkt sich die App ihn.
const useLocation = guard(async () => {
  if (!me) return toast("Wähle oben erst aus, wer du bist.");
  if (!navigator.geolocation) return toast("Dieses Gerät gibt keinen Standort her.");
  toast("Frage den Standort ab …");
  const pos = await new Promise((res, rej) =>
    navigator.geolocation.getCurrentPosition(res, rej, { timeout: 12000, maximumAge: 6 * 3600e3 }))
    .catch(() => { throw new Error("Standort nicht erlaubt oder nicht verfügbar."); });
  await api("member/" + me + "/geo", "POST", { lat: pos.coords.latitude, lon: pos.coords.longitude });
  localStorage.geoAsked = "1";
  toast("Standort gemerkt.");
  await load();
});

// Wenn die Freigabe schon erteilt ist, halten wir ihn still aktuell -
// damit der Hinweis auch stimmt, wenn jemand unterwegs ist.
async function refreshLocation() {
  if (!me || localStorage.geoAsked !== "1" || !navigator.geolocation) return;
  try {
    const st = await navigator.permissions?.query({ name: "geolocation" });
    if (st && st.state !== "granted") return;
    navigator.geolocation.getCurrentPosition(
      (pos) => api("member/" + me + "/geo", "POST", { lat: pos.coords.latitude, lon: pos.coords.longitude }).catch(() => {}),
      () => {}, { timeout: 8000, maximumAge: 12 * 3600e3 });
  } catch {}
}
const previewNudge = guard(async () => {
  const box = $("#nudgePreview");
  box.textContent = "Einen Moment …";
  const r = await (await api("nudges", "POST", { force: me && credit(me, weekOf(todayISO())) > 0 ? "push" : "start" })).json();
  const mine = r.nudges.find(n => n.member_id === me) || r.nudges[0];
  box.innerHTML = mine
    ? `<div class="nudge card" style="margin:10px 0 0"><div class="ic">\u{1F514}</div><div class="tx">
        <b>Das Programm</b><div class="sub">${esc(mine.body)}</div></div></div>`
    : "Gerade wäre nichts fällig – alle sind durch.";
});

const addMember = guard(async () => { const v = $("#nm").value.trim(); if (!v) return; await api("member", "POST", { name: v, joined: todayISO() }); await load(); });
const renameMember = guard(async (id, name) => { await api("member", "POST", { id, name }); await load(); });
const rejoinMember = guard(async (id, joined) => { const m = D.members.find(x => x.id === id); await api("member", "POST", { id, name: m.name, joined }); await load(); });
const delMember = guard(async id => { if (!confirm("Teilnehmer inklusive aller Einträge löschen?")) return; await api("member/" + id, "DELETE"); await load(); });
const delEntry = guard(async id => {
  const e = D.entries.find(x => x.id === id);
  const wer = e && D.members.find(m => m.id === e.member_id)?.name;
  const was = e ? (e.kind === "sick" ? "die Krankmeldung" : e.sport ? `die Einheit „${e.sport}“` : "die Einheit") : "den Eintrag";
  const wann = e ? " vom " + dm(e.date) : "";
  const gruppe = e?.group_id ? "\n\nDas war eine gemeinsame Einheit – sie verschwindet bei allen, die dabei waren." : "";
  if (!confirm(`${was}${wann}${wer ? " von " + wer : ""} wirklich löschen?${gruppe}\n\nDas lässt sich nicht rückgängig machen.`)) return;
  await api("entry/" + id, "DELETE");
  if (editId === id) { editId = null; location.hash = "#feed"; }
  R = null;
  await load();
});
// Foto nachtragen - etwa zu einer Einheit, die automatisch übernommen wurde.
let photoFor = null;
function pickPhoto(entryId) {
  photoFor = entryId;
  let input = document.getElementById("photoPick");
  if (!input) {
    input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.id = "photoPick";
    input.style.display = "none";
    input.onchange = () => uploadPhoto(input.files[0]).finally(() => { input.value = ""; });
    document.body.appendChild(input);
  }
  input.click();
}
const uploadPhoto = guard(async file => {
  if (!file || !photoFor) return;
  toast("Verkleinere das Bild …");
  const photo = await shrink(file);
  await api("entry/" + photoFor + "/photo", "POST", { photo });
  photoFor = null;
  toast("Foto angehängt.");
  await load();
});

const delExpense = guard(async id => { await api("expense/" + id, "DELETE"); await load(); });
const addExpense = guard(async () => {
  const a = +$("#ea").value; if (!a) return toast("Betrag fehlt.");
  await api("expense", "POST", { date: todayISO(), title: $("#et").value, amount: a }); await load();
});

/* ---------- Push ---------- */
const keyToU8 = k => { const s = (k + "=".repeat((4 - k.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"); const r = atob(s); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };

const togglePush = guard(async () => {
  const reg = await navigator.serviceWorker.ready;
  if (localStorage.pushOn === "1") {
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    await api("push/unsubscribe", "POST", { device });
    localStorage.pushOn = "0";
    toast("Push aus."); render(); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("Im Browser blockiert – bitte in den Website-Einstellungen erlauben.");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyToU8(D.vapidPublicKey) });
  await api("push/subscribe", "POST", { device, member_id: me || null, sub: sub.toJSON() });
  localStorage.pushOn = "1";
  toast("Push ist aktiv."); render();
});
const testPush = guard(async () => { await api("push/test", "POST", { device }); toast("Gesendet – Benachrichtigung kommt gleich."); });
async function syncPushMember() {
  if (localStorage.pushOn !== "1" || !("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await api("push/subscribe", "POST", { device, member_id: me || null, sub: sub.toJSON() });
  } catch {}
}

/* ---------- Router ---------- */
const views = { home: viewHome, feed: viewFeed, add: viewAdd, stats: viewStats, set: viewSet };
function render() {
  if (!D) return;
  const h = location.hash.slice(1);
  const page = views[h] ? h : "home";
  $("#app").innerHTML = `<header><img class="dot" src="/icon.svg?v=__V__" alt=""><h1>Das Programm</h1></header>` + views[page]();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.hash === "#" + page));
  if (page === "add") {
    setKind(kind); paintCrew();
    const w = $("#who"); if (w) w.onchange = paintCrew;
    const sp = $("#sport"); if (sp) sp.oninput = resyncMeta;
  }
  document.querySelectorAll("img[data-photo]").forEach(async img => {
    try { img.src = await (await api("photo/" + img.dataset.photo)).text(); } catch { img.remove(); }
  });
}
// Ein Hinweisfeld für alle Diagramme - antippen reicht, Zeigen auch.
(() => {
  const tip = () => document.getElementById("tip");
  let hideTimer = null;
  const show = (el, x, y) => {
    const t = tip();
    if (!t) return;
    t.textContent = el.dataset.tip;
    t.classList.add("on");
    const w = t.offsetWidth, h = t.offsetHeight;
    t.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + "px";
    t.style.top = Math.max(8, y - h - 12) + "px";
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => t.classList.remove("on"), 2600);
  };
  const at = (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) { tip()?.classList.remove("on"); return; }
    const r = el.getBoundingClientRect();
    show(el, r.left + r.width / 2, e.type === "pointerdown" ? r.top : r.top);
  };
  addEventListener("pointerdown", at, { passive: true });
  addEventListener("pointerover", (e) => { if (e.pointerType === "mouse") at(e); }, { passive: true });
})();

addEventListener("hashchange", () => { if (location.hash !== "#add") editId = null; render(); });
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
// Beim Zurückkommen frisch laden - aber nicht, während jemand ein Formular
// ausfüllt. Sonst ist die halb getippte Eingabe weg, nur weil man kurz in
// einem anderen Tab den Schlüssel kopiert hat.
const currentPage = () => (views[location.hash.slice(1)] ? location.hash.slice(1) : "home");
addEventListener("visibilitychange", () => {
  if (document.hidden || !D) return;
  if (currentPage() === "add" || currentPage() === "set") return;
  load();
});
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => {
  if (e.data === "refresh") load();
  if (e.data === "show-feed") { location.hash = "#feed"; load(); }
});
load();
</script>
