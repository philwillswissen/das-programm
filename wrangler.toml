name = "das-programm"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Die Oberfläche steckt direkt im Worker-Bundle (siehe [[rules]]) –
# kein separater Asset-Upload nötig.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.json", "**/*.svg", "**/public/sw.js"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "sportkasse"
database_id = "f846d535-aff2-4ebd-b062-7b4e2f91e952"

[triggers]
crons = ["*/2 * * * *"]  # alle zwei Minuten: Einheiten sollen schnell da sein.
                        # Anstupser und Guthabenmeldung haben eigene Riegel
                        # (Tabelle `nudges`, einmal je Woche) - die laufen
                        # dadurch nicht oefter.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Probeumgebung. Eigener Worker, eigene Datenbank - hier darf getestet werden.
# Die veroeffentlichte Datenbank oben wird von Tests nie angefasst.
#   npm run deploy:staging
#   npm run test:staging
# ---------------------------------------------------------------------------
[env.staging]
name = "das-programm-test"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sportkasse-test"
database_id = "b6b2560a-f2d7-4d90-9fb5-5e9a1fb9ba8b"

[env.staging.observability]
enabled = true

# Secrets (nicht hier eintragen):
#   npx wrangler secret put VAPID_PUBLIC
#   npx wrangler secret put VAPID_PRIVATE
#   npx wrangler secret put VAPID_SUBJECT
#   npx wrangler secret put PIN          # optional: Gruppen-PIN
